<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson | RestPeriod</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.3/pocketbase.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        body { background: #000; padding: 0 0 60px; }
        .lesson-top { display: none; padding: 14px 20px; border-bottom: 1px solid var(--border); font-family: 'Montserrat', sans-serif; font-weight: 800; }
        .lesson-top a { color: white; text-decoration: none; }
        .lesson-top span { color: var(--brand-accent); }
        .lesson-wrap { max-width: 680px; margin: 0 auto; padding: 28px 20px; }
        .lesson-tag { font-size: 0.65rem; color: var(--brand-accent); font-family: 'Montserrat', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        .lesson-title { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.7rem; color: white; line-height: 1.25; margin-bottom: 24px; }
        .lesson-body { font-size: 1rem; color: #ccc; line-height: 1.8; }
        .lesson-body h1, .lesson-body h2, .lesson-body h3 { font-family: 'Montserrat', sans-serif; font-weight: 800; color: white; line-height: 1.3; margin: 32px 0 12px; }
        .lesson-body h1 { font-size: 1.4rem; } .lesson-body h2 { font-size: 1.2rem; color: var(--brand-accent); } .lesson-body h3 { font-size: 1rem; }
        .lesson-body p { margin: 0 0 16px; }
        .lesson-body ul, .lesson-body ol { margin: 0 0 16px; padding-left: 22px; }
        .lesson-body li { margin-bottom: 6px; }
        .lesson-body strong { color: white; }
        .lesson-body a { color: var(--brand-accent); }
        .lesson-body img { max-width: 100%; border-radius: 10px; margin: 8px 0 16px; display: block; }
        .lesson-body blockquote { border-left: 3px solid var(--brand-accent); padding: 4px 0 4px 16px; margin: 0 0 16px; color: #999; font-style: italic; }
        .lesson-body hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
        .lesson-body table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 0.85rem; }
        .lesson-body th, .lesson-body td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
        .lesson-body th { color: var(--brand-accent); font-family: 'Montserrat', sans-serif; font-size: 0.7rem; text-transform: uppercase; }
        .lesson-msg { text-align: center; color: #555; padding: 80px 20px; }
        .lesson-draft { background: #fb923c22; color: #fb923c; border: 1px solid #fb923c44; border-radius: 6px; padding: 6px 10px; font-size: 0.7rem; font-family: 'Montserrat', sans-serif; font-weight: 800; display: inline-block; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="lesson-top" id="lesson-top"><a href="index.html">REST <span>PERIOD</span></a></div>
<div class="lesson-wrap" id="lesson"><div class="lesson-msg">Loading…</div></div>
<script>
const PB_URL = 'https://restperiod.org';
const pb = new PocketBase(PB_URL);
if (window.self === window.top) document.getElementById('lesson-top').style.display = 'block';

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Shared renderer (education.html uses the same rules for its preview)
function renderLessonHTML(rec) {
    const md = rec.body || '';
    const html = DOMPurify.sanitize(marked.parse(md, { breaks: true }));
    return `${rec.published ? '' : '<div class="lesson-draft">DRAFT — only visible to admins</div>'}
        ${rec.tag ? `<div class="lesson-tag">${esc(rec.tag)}</div>` : ''}
        <div class="lesson-title">${esc(rec.title)}</div>
        <div class="lesson-body">${html}</div>`;
}

(async () => {
    const id = new URLSearchParams(location.search).get('id');
    const el = document.getElementById('lesson');
    if (!id) { el.innerHTML = '<div class="lesson-msg">Lesson not found.</div>'; return; }
    try {
        const rec = await pb.collection('lessons').getOne(id, { requestKey: null });
        document.title = rec.title + ' | RestPeriod';
        el.innerHTML = renderLessonHTML(rec);
    } catch (e) {
        el.innerHTML = '<div class="lesson-msg">Lesson not found.</div>';
    }
})();
</script>
</body>
</html>

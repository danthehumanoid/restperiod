<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Dashboard | RestPeriod</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.3/pocketbase.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap');
        :root {
            --brand-bg: #020c12; --card-bg: #0e1b24; --brand-accent: #26C6DA;
            --brand-secondary: #2E7D32; --text-main: #E0F7FA; --brand-danger: #ff5252;
            --border: #1a2a35;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Open Sans', sans-serif; background: var(--brand-bg); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

        .nav-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: #000; border-bottom: 1px solid #004d7a; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 8px; }
        .nav-brand { font-family: 'Montserrat'; font-weight: 800; font-size: 1.1rem; }
        .nav-brand span { color: var(--brand-accent); }
        .nav-links { display: flex; gap: 16px; }
        .nav-links a { color: #888; text-decoration: none; font-family: 'Montserrat'; font-weight: 700; font-size: 0.75rem; transition: 0.2s; }
        .nav-links a:hover { color: var(--brand-accent); }
        .nav-links a.active { color: white; border-bottom: 2px solid var(--brand-accent); }

        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        /* STAT CARDS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px 16px; text-align: center; position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--brand-accent); }
        .stat-card.green::before { background: var(--brand-secondary); }
        .stat-card.red::before { background: var(--brand-danger); }
        .stat-card.purple::before { background: #c084fc; }
        .stat-icon { font-size: 1.4rem; margin-bottom: 8px; }
        .stat-val { font-family: 'Montserrat'; font-size: 2rem; font-weight: 800; color: var(--brand-accent); line-height: 1; margin-bottom: 4px; }
        .stat-card.green .stat-val { color: #4ade80; }
        .stat-card.red .stat-val { color: var(--brand-danger); }
        .stat-card.purple .stat-val { color: #c084fc; }
        .stat-label { font-size: 0.65rem; color: #888; font-family: 'Montserrat'; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

        /* DATA CARDS */
        .data-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 24px; overflow: hidden; }
        .data-card-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .data-card-title { font-family: 'Montserrat'; font-size: 0.72rem; font-weight: 800; color: var(--brand-accent); text-transform: uppercase; letter-spacing: 1px; }

        /* TABLES */
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { padding: 10px 16px; text-align: left; font-size: 0.58rem; font-family: 'Montserrat'; font-weight: 800; color: #555; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); background: #050d12; }
        .data-table td { padding: 11px 16px; font-size: 0.82rem; border-bottom: 1px solid #0a1520; vertical-align: middle; }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background: rgba(38,198,218,0.03); }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 800; font-family: 'Montserrat'; }
        .badge-blue { background: #26C6DA22; color: var(--brand-accent); border: 1px solid #26C6DA44; }
        .badge-green { background: #2E7D3222; color: #4ade80; border: 1px solid #2E7D3244; }
        .badge-purple { background: #c084fc22; color: #c084fc; border: 1px solid #c084fc44; }
        .badge-red { background: #ff525222; color: #ff5252; border: 1px solid #ff525244; }
        .badge-orange { background: #fb923c22; color: #fb923c; border: 1px solid #fb923c44; }

        /* ADD COACH FORM */
        .add-coach-form { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; padding: 16px 18px; background: #050d12; border-top: 1px solid var(--border); }
        .form-group label { font-size: 0.58rem; font-family: 'Montserrat'; font-weight: 800; color: #888; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .form-group input { width: 100%; background: var(--card-bg); border: 1px solid var(--border); color: white; padding: 9px 12px; border-radius: 6px; font-family: inherit; font-size: 0.85rem; }
        .form-group input:focus { outline: none; border-color: var(--brand-accent); }

        .btn { border: none; padding: 9px 18px; border-radius: 6px; font-family: 'Montserrat'; font-weight: 800; font-size: 0.7rem; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-accent { background: var(--brand-accent); color: #000; }
        .btn-accent:hover { background: #fff; color: #000; }
        .btn-green { background: var(--brand-secondary); color: white; }
        .btn-green:hover { background: #3a9a3e; }
        .btn-danger { background: transparent; border: 1px solid var(--brand-danger); color: var(--brand-danger); }
        .btn-danger:hover { background: var(--brand-danger); color: white; }

        /* PROGRESS BAR */
        .mini-bar { background: #0a1520; border-radius: 4px; height: 5px; overflow: hidden; margin-top: 4px; }
        .mini-bar-fill { height: 100%; background: linear-gradient(90deg, var(--brand-secondary), var(--brand-accent)); border-radius: 4px; }

        /* SEARCH */
        .table-search { background: #050d12; border: 1px solid var(--border); color: white; padding: 7px 12px; border-radius: 6px; font-family: inherit; font-size: 0.82rem; width: 200px; }
        .table-search:focus { outline: none; border-color: var(--brand-accent); }

        /* FREE PROGRAM CARD */
        .free-prog-card { background: #050d12; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin: 0 16px 12px; transition: 0.2s; }
        .free-prog-card:hover { border-color: var(--brand-accent); }
        .free-prog-name { font-family: 'Montserrat'; font-weight: 800; font-size: 0.92rem; color: white; margin-bottom: 4px; }
        .free-prog-desc { font-size: 0.75rem; color: #888; font-style: italic; margin-bottom: 10px; min-height: 18px; }
        .free-prog-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .free-prog-actions { display: flex; gap: 8px; margin-top: 10px; }

        /* LOADING */
        .loading { text-align: center; padding: 40px; color: #333; font-size: 0.85rem; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #1a2a35; border-top-color: var(--brand-accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            .add-coach-form { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .two-col { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
<body>

<div class="nav-top">
    <div class="nav-brand">REST <span>PERIOD</span> <span style="font-size:0.65rem;color:#555;font-weight:700;margin-left:8px;">MEGA DASHBOARD</span></div>
    <div class="nav-links">
        <a href="dashboard.html">Coach</a>
        <a href="builder.html">Builder</a>
        <a href="library.html">Library</a>
        <a href="megauser.html" class="active">Mega</a>
        <a href="#" onclick="handleLogout()">Logout</a>
    </div>
</div>

<div class="container">

    <!-- STATS -->
    <div class="stats-grid" id="stats-grid">
        <div class="loading"><span class="spinner"></span>Loading...</div>
    </div>

    <!-- TWO COL: TRAINERS + FREE USERS -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-bottom:24px;" class="two-col">

        <!-- TRAINERS -->
        <div class="data-card">
            <div class="data-card-header">
                <div class="data-card-title">🏋️ Trainers</div>
                <button class="btn btn-accent" onclick="toggleAddCoach()">+ Add Trainer</button>
            </div>
            <div id="add-coach-form" style="display:none;">
                <div class="add-coach-form">
                    <div class="form-group"><label>Name</label><input type="text" id="new-coach-name" placeholder="Jane Smith"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="new-coach-email" placeholder="jane@gym.com"></div>
                    <div class="form-group"><label>Password</label><input type="text" id="new-coach-pass" placeholder="Temp password"></div>
                    <button class="btn btn-green" onclick="saveNewCoach()">Create</button>
                </div>
            </div>
            <table class="data-table">
                <thead><tr><th>Name</th><th>Email</th><th>Clients</th><th>Programs</th></tr></thead>
                <tbody id="trainers-table"><tr><td colspan="4" class="loading"><span class="spinner"></span></td></tr></tbody>
            </table>
        </div>

        <!-- FREE USERS -->
        <div class="data-card">
            <div class="data-card-header">
                <div class="data-card-title">🆓 Free Users</div>
                <input type="text" class="table-search" placeholder="Search..." oninput="filterFreeUsers(this.value)">
            </div>
            <table class="data-table">
                <thead><tr><th>Name</th><th>Email</th><th>Joined</th></tr></thead>
                <tbody id="free-users-table"><tr><td colspan="3" class="loading"><span class="spinner"></span></td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- CLIENTS -->
    <div class="data-card" style="margin-bottom:24px;">
        <div class="data-card-header">
            <div class="data-card-title">👥 All Clients</div>
            <input type="text" class="table-search" placeholder="Search clients..." oninput="filterClients(this.value)">
        </div>
        <table class="data-table">
            <thead><tr><th>Name</th><th>Email</th><th>Programs</th><th>Joined</th></tr></thead>
            <tbody id="clients-table"><tr><td colspan="4" class="loading"><span class="spinner"></span></td></tr></tbody>
        </table>
    </div>

    <!-- FREE PROGRAMS MANAGER -->
    <div class="data-card" style="margin-bottom:24px;">
        <div class="data-card-header">
            <div class="data-card-title">🌐 Free Programs</div>
            <a href="builder.html" class="btn btn-green">+ Create in Builder</a>
        </div>
        <div id="free-programs-list" style="padding:8px 0;">
            <div class="loading"><span class="spinner"></span></div>
        </div>
    </div>

    <!-- ALL PROGRAMS -->
    <div class="data-card">
        <div class="data-card-header">
            <div class="data-card-title">📋 Active Programs</div>
            <input type="text" class="table-search" placeholder="Search programs..." oninput="filterPrograms(this.value)">
        </div>
        <table class="data-table">
            <thead><tr><th>Program</th><th>Client</th><th>Progress</th><th>Sessions</th><th>Last Active</th><th>Status</th></tr></thead>
            <tbody id="programs-table"><tr><td colspan="6" class="loading"><span class="spinner"></span></td></tr></tbody>
        </table>
    </div>

</div>

<script>
(function() {
    const pb2 = new PocketBase('https://restperiod.org');
    if (!pb2.authStore.isValid) { window.location.href = '/index.html'; return; }
    if (pb2.authStore.model.role !== 'admin') { window.location.href = '/index.html'; }
})();

const pb = new PocketBase('https://restperiod.org');
let allTrainers = [], allClients = [], allFreeUsers = [], allPrograms = [], allFreePrograms = [];
let clientProgramMap = {};

window.onload = async () => {
    if (!pb.authStore.isValid) { window.location.href = 'index.html'; return; }
    await loadAll();
};

async function loadAll() {
    try {
        const [usersRes, programsRes, freeProgsRes] = await Promise.all([
            pb.collection('users').getFullList({ sort: 'name', requestKey: null }),
            pb.collection('programs').getFullList({ filter: 'archived=false', sort: '-created', requestKey: null }),
            pb.collection('programs').getFullList({ filter: 'is_free=true && archived=false', sort: 'name', requestKey: null })
        ]);

        allTrainers = usersRes.filter(u => u.role === 'trainer' || u.role === 'admin');
        allClients = usersRes.filter(u => u.role === 'client');
        allFreeUsers = usersRes.filter(u => u.role === 'free');
        allPrograms = programsRes;
        allFreePrograms = freeProgsRes;

        clientProgramMap = {};
        allPrograms.forEach(p => {
            if (!clientProgramMap[p.client]) clientProgramMap[p.client] = [];
            clientProgramMap[p.client].push(p);
        });

        renderStats();
        renderTrainers();
        renderClients();
        renderFreeUsers();
        renderFreePrograms();
        renderPrograms();

    } catch(e) { console.error(e); }
}

// ── STATS ──────────────────────────────────────────
function renderStats() {
    let inProgress = 0, newThisMonth = 0;
    const thisMonth = new Date(); thisMonth.setDate(1); thisMonth.setHours(0,0,0,0);

    allPrograms.forEach(p => {
        try {
            let data = p.workout_data;
            if (typeof data === 'string') data = JSON.parse(data);
            if (!data) return;
            const schedule = data.schedule || data;
            if (!Array.isArray(schedule)) return;
            const done = schedule.filter(s => s.sessionDate).length;
            if (done > 0 && done < schedule.length) inProgress++;
        } catch(e) {}
        if (new Date(p.created) >= thisMonth) newThisMonth++;
    });

    const totalSessions = allPrograms.reduce((acc, p) => {
        try {
            let data = p.workout_data;
            if (typeof data === 'string') data = JSON.parse(data);
            const schedule = data.schedule || data;
            return acc + (Array.isArray(schedule) ? schedule.filter(s => s.sessionDate).length : 0);
        } catch(e) { return acc; }
    }, 0);

    document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="stat-icon">🏋️</div><div class="stat-val">${allTrainers.length}</div><div class="stat-label">Trainers</div></div>
        <div class="stat-card green"><div class="stat-icon">👥</div><div class="stat-val">${allClients.length}</div><div class="stat-label">Clients</div></div>
        <div class="stat-card purple"><div class="stat-icon">🆓</div><div class="stat-val">${allFreeUsers.length}</div><div class="stat-label">Free Users</div></div>
        <div class="stat-card"><div class="stat-icon">🌐</div><div class="stat-val">${allFreePrograms.length}</div><div class="stat-label">Free Programs</div></div>
        <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-val">${allPrograms.length}</div><div class="stat-label">Total Programs</div></div>
        <div class="stat-card green"><div class="stat-icon">🔥</div><div class="stat-val">${inProgress}</div><div class="stat-label">In Progress</div></div>
        <div class="stat-card"><div class="stat-icon">✨</div><div class="stat-val">${newThisMonth}</div><div class="stat-label">New This Month</div></div>
        <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-val">${totalSessions}</div><div class="stat-label">Sessions Logged</div></div>
    `;
}

// ── TRAINERS ──────────────────────────────────────
function renderTrainers() {
    if (!allTrainers.length) {
        document.getElementById('trainers-table').innerHTML = '<tr><td colspan="4" style="text-align:center;color:#555;padding:20px;">No trainers yet.</td></tr>';
        return;
    }
    document.getElementById('trainers-table').innerHTML = allTrainers.map(t => {
        const progCount = allPrograms.filter(p => !p.is_free && !p.is_template).length;
        return `<tr>
            <td><strong>${t.name}</strong></td>
            <td style="color:#888;font-size:0.78rem;">${t.email}</td>
            <td><span class="badge badge-blue">${allClients.length}</span></td>
            <td><span class="badge badge-green">${progCount}</span></td>
        </tr>`;
    }).join('');
}

// ── CLIENTS ───────────────────────────────────────
function renderClients(filter = '') {
    const filtered = filter ? allClients.filter(c =>
        c.name.toLowerCase().includes(filter) || c.email.toLowerCase().includes(filter)
    ) : allClients;

    if (!filtered.length) {
        document.getElementById('clients-table').innerHTML = '<tr><td colspan="4" style="text-align:center;color:#555;padding:20px;">No clients found.</td></tr>';
        return;
    }
    document.getElementById('clients-table').innerHTML = filtered.map(c => {
        const progs = clientProgramMap[c.id] || [];
        const joined = new Date(c.created).toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'});
        return `<tr>
            <td><strong>${c.name}</strong></td>
            <td style="color:#888;font-size:0.78rem;">${c.email}</td>
            <td><span class="badge badge-green">${progs.length} program${progs.length!==1?'s':''}</span></td>
            <td style="color:#555;font-size:0.78rem;">${joined}</td>
        </tr>`;
    }).join('');
}
function filterClients(q) { renderClients(q.toLowerCase()); }

// ── FREE USERS ────────────────────────────────────
function renderFreeUsers(filter = '') {
    const filtered = filter ? allFreeUsers.filter(u =>
        u.name.toLowerCase().includes(filter) || u.email.toLowerCase().includes(filter)
    ) : allFreeUsers;

    if (!filtered.length) {
        document.getElementById('free-users-table').innerHTML = '<tr><td colspan="3" style="text-align:center;color:#555;padding:20px;">No free users yet.</td></tr>';
        return;
    }
    document.getElementById('free-users-table').innerHTML = filtered.map(u => {
        const joined = new Date(u.created).toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'});
        return `<tr>
            <td><strong>${u.name}</strong></td>
            <td style="color:#888;font-size:0.78rem;">${u.email}</td>
            <td style="color:#555;font-size:0.78rem;">${joined}</td>
        </tr>`;
    }).join('');
}
function filterFreeUsers(q) { renderFreeUsers(q.toLowerCase()); }

// ── FREE PROGRAMS MANAGER ─────────────────────────
function renderFreePrograms() {
    const container = document.getElementById('free-programs-list');
    if (!allFreePrograms.length) {
        container.innerHTML = `<div style="text-align:center;color:#555;padding:30px;font-size:0.85rem;">
            No free programs yet.<br><br>
            <a href="builder.html" class="btn btn-accent" style="font-size:0.72rem;">Create one in Builder →</a>
        </div>`;
        return;
    }
    container.innerHTML = allFreePrograms.map(p => {
        let data = p.workout_data;
        if (typeof data === 'string') try { data = JSON.parse(data); } catch(e) { data = {}; }
        const schedule = data.schedule || data || [];
        const sessionCount = Array.isArray(schedule) ? schedule.length : 0;
        const typeBadge = p.is_repeatable
            ? `<span class="badge badge-purple">🔁 Repeatable</span>`
            : `<span class="badge badge-blue">${sessionCount} session${sessionCount!==1?'s':''}</span>`;

        // Count how many free users have claimed this
        const claimedCount = allPrograms.filter(pr =>
            pr.name === p.name && !pr.is_free && pr.client
        ).length;

        return `<div class="free-prog-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
                <div style="flex:1;">
                    <div class="free-prog-name">${p.name}</div>
                    <div class="free-prog-desc">${p.description || 'No description'}</div>
                    <div class="free-prog-meta">
                        ${typeBadge}
                        ${claimedCount > 0 ? `<span class="badge badge-green">👥 ${claimedCount} claimed</span>` : ''}
                        ${p.is_repeatable ? '' : `<span style="font-size:0.7rem;color:#555;">${sessionCount} sessions</span>`}
                    </div>
                </div>
                <div class="free-prog-actions">
                    <a href="builder.html?editId=${p.id}&clientId=${p.client}" class="btn btn-accent" style="font-size:0.65rem;padding:6px 12px;">✏️ Edit</a>
                    <button onclick="removeFreeProgram('${p.id}')" class="btn btn-danger" style="font-size:0.65rem;padding:6px 12px;">🗑</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

async function removeFreeProgram(id) {
    if (!confirm('Remove this from the free program library? Clients who already claimed it keep their copy.')) return;
    try {
        await pb.collection('programs').update(id, { is_free: false });
        await loadAll();
    } catch(e) { alert(e.message); }
}

// ── ALL PROGRAMS ──────────────────────────────────
function renderPrograms(filter = '') {
    const filtered = filter ? allPrograms.filter(p =>
        p.name.toLowerCase().includes(filter)
    ) : allPrograms;

    if (!filtered.length) {
        document.getElementById('programs-table').innerHTML = '<tr><td colspan="6" style="text-align:center;color:#555;padding:20px;">No programs found.</td></tr>';
        return;
    }

    document.getElementById('programs-table').innerHTML = filtered.map(p => {
        let data = p.workout_data;
        if (typeof data === 'string') try { data = JSON.parse(data); } catch(e) { data = {}; }
        const schedule = data.schedule || data || [];
        const totalSessions = Array.isArray(schedule) ? schedule.length : 0;
        const completedSessions = Array.isArray(schedule) ? schedule.filter(s => s.sessionDate).length : 0;

        let totalSets = 0, doneSets = 0;
        if (Array.isArray(schedule)) {
            schedule.forEach(s => {
                [...(s.warmup||[]), ...(s.exercises||[])].forEach(ex => {
                    (ex.setsData||[]).forEach(set => { totalSets++; if (set.act_reps && set.act_weight) doneSets++; });
                });
            });
        }
        const pct = totalSets > 0 ? Math.round((doneSets/totalSets)*100) : 0;
        const lastSession = Array.isArray(schedule) ? schedule.filter(s=>s.sessionDate).sort((a,b)=>b.sessionDate>a.sessionDate?1:-1)[0] : null;
        const lastActive = lastSession ? new Date(lastSession.sessionDate).toLocaleDateString([],{day:'numeric',month:'short'}) : '—';
        const client = allClients.find(c => c.id === p.client);
        const clientName = client?.name || (p.is_free ? 'Free/Public' : '—');

        let statusBadge = '';
        if (p.is_free) statusBadge = `<span class="badge badge-purple">Free</span>`;
        else if (completedSessions === 0) statusBadge = `<span class="badge badge-red">Not Started</span>`;
        else if (completedSessions >= totalSessions && totalSessions > 0) statusBadge = `<span class="badge badge-green">Complete</span>`;
        else statusBadge = `<span class="badge badge-blue">In Progress</span>`;

        return `<tr>
            <td><strong>${p.name}</strong>${p.is_repeatable ? ' <span class="badge badge-purple" style="font-size:0.5rem;">🔁</span>' : ''}</td>
            <td style="color:#888;font-size:0.78rem;">${clientName}</td>
            <td>
                <div style="font-size:0.75rem;color:var(--brand-accent);font-weight:700;">${pct}%</div>
                <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
            </td>
            <td style="font-size:0.78rem;color:#888;">${completedSessions}/${totalSessions}</td>
            <td style="font-size:0.78rem;color:#555;">${lastActive}</td>
            <td>${statusBadge}</td>
        </tr>`;
    }).join('');
}
function filterPrograms(q) { renderPrograms(q.toLowerCase()); }

// ── ADD COACH ─────────────────────────────────────
function toggleAddCoach() {
    const form = document.getElementById('add-coach-form');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
}

async function saveNewCoach() {
    const name = document.getElementById('new-coach-name').value.trim();
    const email = document.getElementById('new-coach-email').value.trim();
    const pass = document.getElementById('new-coach-pass').value.trim();
    if (!name || !email || !pass) return alert('Please fill in all fields.');
    try {
        await pb.collection('users').create({ name, email, password: pass, passwordConfirm: pass, role: 'trainer' });
        document.getElementById('new-coach-name').value = '';
        document.getElementById('new-coach-email').value = '';
        document.getElementById('new-coach-pass').value = '';
        document.getElementById('add-coach-form').style.display = 'none';
        await loadAll();
    } catch(e) { alert('Failed: ' + e.message); }
}

function handleLogout() { pb.authStore.clear(); window.location.href = 'index.html'; }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Training | RestPeriod</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.3/pocketbase.umd.min.js"></script>
    <script src="exercises.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap');
        :root { --brand-primary: #003B5C; --brand-secondary: #2E7D32; --brand-accent: #26C6DA; --brand-bg: #020c12; --text-main: #E0F7FA; --card-bg: #0e1b24; --input-bg: #002840; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Open Sans', sans-serif; background: var(--brand-bg); color: var(--text-main); padding-bottom: 80px; overflow-x: hidden; }
 /* Remove number input spinners */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

        .nav-top { display: flex; justify-content: space-between; padding: 5px 15px; background: #000; border-bottom: 1px solid #004d7a; align-items: center; position: sticky; top: 0; z-index: 1000; height: 70px; }
        .header-tool { color: var(--brand-accent); border: 1.5px solid rgba(38,198,218,0.5); border-radius: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; background: rgba(0,0,0,0.4); transition: 0.2s; }
        .header-tool:hover { background: rgba(38,198,218,0.1); border-color: var(--brand-accent); }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid #004d7a; margin-bottom: 20px; }
        .selector-divider { font-size: 0.6rem; color: #555; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin: 10px 0 4px; font-family: 'Montserrat'; display: block; }
        .quad-title { font-size: 0.65rem; color: #aaa; text-transform: uppercase; font-weight: 800; margin-bottom: 5px; display: block; }
        select { width: 100%; background: var(--input-bg); border: 1px solid #004d7a; color: white; padding: 10px; border-radius: 4px; font-family: inherit; font-size: 0.9rem; margin-bottom: 4px; }

        .progress-container { width: 100%; background: #111; border-radius: 10px; height: 12px; margin: 15px 0; border: 1px solid #333; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--brand-secondary), var(--brand-accent)); width: 0%; transition: 0.5s; }

        .tab-wrap { display: flex; overflow-x: auto; margin-bottom: 20px; gap: 5px; -webkit-overflow-scrolling: touch; }
        .tab { padding: 8px 14px; background: #001a2c; border: 1px solid #333; cursor: pointer; border-radius: 4px; font-size: 0.8rem; white-space: nowrap; color: #888; font-weight: 600; text-align: center; flex-shrink: 0; }
        .tab.active { background: var(--brand-accent); color: black; font-weight: 800; }
        .tab-date { font-size: 0.55rem; display: block; opacity: 0.7; margin-top: 2px; }

        .section-header { background: #000; color: white; padding: 12px 15px; border-radius: 4px; margin: 25px 0 10px 0; font-family: 'Montserrat'; font-weight: 800; border-left: 4px solid var(--brand-accent); font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

        .exercise-card { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid #004d7a; margin-bottom: 20px; }
        .exercise-title { font-family: 'Montserrat'; font-size: 1.1rem; font-weight: 800; color: var(--brand-accent); margin: 0 0 14px 0; border-bottom: 1px solid #222; padding-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }

        .set-container { background: #000; border-radius: 8px; padding: 12px; margin-bottom: 10px; border: 1px solid #1a2c3a; }
        .set-label { font-size: 0.65rem; font-weight: 800; color: var(--brand-accent); font-family: 'Montserrat'; margin-bottom: 8px; letter-spacing: 0.5px; }

        /* DO / DID grid */
        .set-grid { display: grid; grid-template-columns: 36px 1fr 1fr 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }
        .set-row-label { font-size: 0.58rem; font-weight: 800; font-family: 'Montserrat'; text-align: right; padding-right: 4px; }
        .cell-header { font-size: 0.46rem; font-weight: 800; font-family: 'Montserrat'; text-align: center; margin-bottom: 2px; }
        .do-cell { padding: 9px 6px; text-align: center; border: 1px solid #26C6DA33; background: #00131c; font-size: 0.95rem; color: #26C6DA; font-weight: 700; border-radius: 4px; }
        .did-cell { padding: 9px 6px; text-align: center; border: 1px solid #2E7D32; background: #0e1b24; font-size: 0.95rem; color: #4ade80; font-weight: 700; border-radius: 4px; width: 100%; font-family: inherit; }
        .did-cell:focus { outline: none; border-color: #4ade80; }
        .tick-wrap { display: flex; justify-content: center; }
        .tick-box { appearance: none; -webkit-appearance: none; background-color: #111; border: 2px solid var(--brand-secondary); border-radius: 4px; width: 36px; height: 36px; cursor: pointer; position: relative; flex-shrink: 0; }
        .tick-box:checked { background-color: var(--brand-secondary); }
        .tick-box:checked::after { content: '✔'; color: white; font-size: 1.1rem; font-weight: bold; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }

        .note-input { width: 100%; background: #111; border: 1px solid #333; color: #ccc; padding: 9px 10px; border-radius: 4px; font-size: 0.85rem; font-family: inherit; margin-top: 8px; }

        .date-row { background: var(--card-bg); border: 1px solid #004d7a; border-radius: 8px; padding: 14px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .date-input { background: #000; border: 1px solid #004d7a; color: white; padding: 8px 12px; border-radius: 4px; font-size: 0.9rem; font-family: inherit; }
        .date-scheduled { font-size: 0.75rem; color: #888; padding: 6px 12px; background: #0a1a2a; border: 1px solid #1a2a35; border-radius: 6px; }
        .date-scheduled span { color: var(--brand-accent); font-weight: 800; }
        .date-completed { font-size: 0.75rem; color: #4ade80; padding: 6px 12px; background: #052e16; border: 1px solid #166534; border-radius: 6px; font-weight: 800; }
        .date-not-logged { font-size: 0.75rem; color: #555; }

        #sync-toast { position: fixed; bottom: 20px; right: 20px; background: var(--brand-secondary); color: white; padding: 10px 20px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; display: none; z-index: 7000; }

        .modal { display: none; position: fixed; z-index: 5000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); overflow: auto; }
        .modal-content { background: var(--card-bg); margin: 10% auto; padding: 25px; border: 1px solid var(--brand-accent); width: 90%; max-width: 450px; border-radius: 12px; position: relative; }
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 6000; top: 0; right: 0; background-color: #000; overflow-x: hidden; transition: 0.4s; padding-top: 60px; border-left: 1px solid var(--brand-accent); }
        .sidebar a { padding: 10px 20px; text-decoration: none; font-size: 1.1rem; color: #818181; display: block; font-family: 'Montserrat'; }

        .t-unit-btn { padding: 5px 10px; border: none; background: none; color: #555; font-family: 'Montserrat'; font-weight: 800; font-size: 0.65rem; cursor: pointer; transition: 0.2s; }
        .t-unit-btn.active { background: var(--brand-accent); color: #000; }
        .tool-inp { width: 100%; background: #000; border: 1px solid #1a2c3a; border-radius: 4px; color: white; padding: 9px 10px; font-size: 0.9rem; font-family: inherit; margin-bottom: 10px; }
        .tool-inp:focus { outline: none; border-color: var(--brand-accent); }
        .tool-action-btn { padding: 11px; border: none; border-radius: 6px; background: var(--brand-primary); color: white; font-family: 'Montserrat'; font-weight: 800; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .tool-action-btn:hover { background: #004d7a; }
        .tool-action-btn.running { background: #7f1d1d; color: #f87171; }
    </style>
</head>
<body>

<div id="sync-toast">Synced ✓</div>

<div class="nav-top">
    <canvas id="nav-clock" width="45" height="45" style="background:#000; border-radius:50%; border:1.5px solid var(--brand-accent); flex-shrink:0;"></canvas>
    <div style="display:flex; gap:8px; overflow-x:auto; padding:0 10px; align-items:center; -webkit-overflow-scrolling:touch;">
        <div class="header-tool" onclick="openTool('pace-tool')"><i class="fas fa-running"></i></div>
        <div class="header-tool" onclick="openTool('onerm-tool')"><i class="fas fa-weight-hanging"></i></div>
        <div class="header-tool" onclick="openTool('metronome-tool')"><i class="fas fa-drum"></i></div>
        <div class="header-tool" onclick="openTool('interval-tool')"><i class="fas fa-redo"></i></div>
        <div class="header-tool" onclick="openTool('countdown-tool')"><i class="fas fa-hourglass-half"></i></div>
        <div class="header-tool" onclick="openTool('stopwatch-tool')"><i class="fas fa-stopwatch"></i></div>
    </div>
    <div onclick="openNav()" style="font-size:1.5rem; cursor:pointer; padding:8px;">&#9776;</div>
</div>

<div id="mySidebar" class="sidebar">
    <a href="javascript:void(0)" onclick="closeNav()" style="font-size:2rem;">&times;</a>
    <a href="client-dashboard.html">← MY DASHBOARD</a>
    <a href="#" onclick="pb.authStore.clear(); window.location.href='index.html';">LOGOUT</a>
</div>

<div class="container">
    <div class="card">
        <span class="selector-divider">Your Programs</span>
        <select id="program-selector" onchange="loadSelectedProgram('own')"></select>
        <span class="selector-divider">Premade Programs</span>
        <select id="premade-selector" onchange="loadSelectedProgram('premade')">
            <option value="">-- Browse premade programs --</option>
        </select>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
            <span class="quad-title">Session Completion</span>
            <span id="progress-percent" style="font-weight:bold; color:var(--brand-accent);">0%</span>
        </div>
        <div class="progress-container"><div class="progress-fill" id="progress-bar"></div></div>
    </div>

    <div class="tab-wrap" id="week-tabs-container"></div>
    <div id="workout-content"></div>
</div>

<!-- VIDEO MODAL -->
<div id="videoModal" class="modal">
    <div class="modal-content" style="max-width:800px; padding:10px; background:#000; border-radius:12px; position:relative;">
        <span onclick="closeVideoModal()" style="position:absolute; right:15px; top:10px; color:white; font-size:2.5rem; cursor:pointer; z-index:100;">&times;</span>
        <div id="video-player-content" style="width:100%; border-radius:8px; overflow:hidden; background:#000; min-height:250px;"></div>
    </div>
</div>

<!-- TOOL MODAL -->
<div id="toolModal" class="modal">
    <div class="modal-content" style="max-width:480px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <span id="tool-modal-title" style="font-family:'Montserrat'; font-weight:800; font-size:1rem; color:var(--brand-accent);"></span>
            <span onclick="closeTool()" style="cursor:pointer; font-size:1.5rem; color:#888;">&times;</span>
        </div>
        <div id="pace-tool" class="tool-content" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <p style="font-size:0.7rem; color:#555; margin:0;">Fill any 2 fields — leave 1 blank to solve.</p>
                <div style="display:flex; border:1px solid #1a2a35; border-radius:6px; overflow:hidden;">
                    <button id="t-pace-km-btn" class="t-unit-btn active" onclick="tSetPaceUnit('km')">KM</button>
                    <button id="t-pace-mi-btn" class="t-unit-btn" onclick="tSetPaceUnit('mi')">MI</button>
                </div>
            </div>
            <label class="quad-title" id="t-pace-dist-label">Distance (km)</label>
            <input type="number" class="tool-inp" id="t-pace-dist" placeholder="e.g. 10" step="0.01" />
            <label class="quad-title">Total Time</label>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
                <div><label class="quad-title">Min</label><input type="number" class="tool-inp" id="t-pace-min" placeholder="0" /></div>
                <div><label class="quad-title">Sec</label><input type="number" class="tool-inp" id="t-pace-sec" placeholder="0" min="0" max="59" /></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
                <div>
                    <label class="quad-title" id="t-pace-pace-label">Pace (min:sec /km)</label>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px;">
                        <input type="number" class="tool-inp" id="t-pace-pace-min" placeholder="min" />
                        <input type="number" class="tool-inp" id="t-pace-pace-sec" placeholder="sec" min="0" max="59" />
                    </div>
                </div>
                <div>
                    <label class="quad-title" id="t-pace-speed-label">Speed (km/h)</label>
                    <input type="number" class="tool-inp" id="t-pace-speed" placeholder="e.g. 12" step="0.1" />
                </div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <button class="tool-action-btn" onclick="tSolvePace()">Solve</button>
                <button class="tool-action-btn" onclick="tClearPace()">Clear</button>
            </div>
            <div id="t-pace-output" style="display:none; background:#000; border-left:3px solid var(--brand-accent); padding:10px; border-radius:4px; font-size:0.8rem; margin-top:10px; line-height:1.8;"></div>
        </div>
        <div id="onerm-tool" class="tool-content" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <p style="font-size:0.7rem; color:#555; margin:0;">Epley &amp; Brzycki for 1–10 reps</p>
                <div style="display:flex; border:1px solid #1a2a35; border-radius:6px; overflow:hidden;">
                    <button id="t-rm-kg-btn" class="t-unit-btn active" onclick="tSetRMUnit('kg')">KG</button>
                    <button id="t-rm-lb-btn" class="t-unit-btn" onclick="tSetRMUnit('lb')">LB</button>
                </div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
                <div><label class="quad-title" id="t-rm-weight-label">Weight (kg)</label><input type="number" class="tool-inp" id="t-rm-weight" placeholder="e.g. 100" /></div>
                <div><label class="quad-title">Reps done</label><input type="number" class="tool-inp" id="t-rm-reps" placeholder="e.g. 5" min="1" max="30" /></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <button class="tool-action-btn" onclick="tCalc1RM()">Calculate</button>
                <button class="tool-action-btn" onclick="tClear1RM()">Clear</button>
            </div>
            <div id="t-rm-output" style="display:none; margin-top:10px; max-height:220px; overflow-y:auto;">
                <table style="width:100%; border-collapse:collapse; font-size:0.78rem;">
                    <thead><tr>
                        <th style="color:var(--brand-accent); padding:5px; border-bottom:1px solid #1a2a35; text-align:center;">Reps</th>
                        <th style="color:var(--brand-accent); padding:5px; border-bottom:1px solid #1a2a35; text-align:center;">Epley</th>
                        <th style="color:var(--brand-accent); padding:5px; border-bottom:1px solid #1a2a35; text-align:center;">Brzycki</th>
                    </tr></thead>
                    <tbody id="t-rm-table-body"></tbody>
                </table>
            </div>
        </div>
        <div id="metronome-tool" class="tool-content" style="display:none; text-align:center;">
            <p style="font-size:0.7rem; color:#555; margin-bottom:12px;">(Ensure Silent Mode is OFF)</p>
            <div id="t-bpm-val" style="font-size:4rem; color:var(--brand-accent); font-weight:800; font-family:'Montserrat'; transition:all 0.05s;">60</div>
            <label class="quad-title">Beats Per Minute</label>
            <input type="range" id="t-m-slider" min="40" max="220" value="60" style="width:100%; margin:10px 0; accent-color:var(--brand-accent);" oninput="document.getElementById('t-bpm-val').textContent=this.value" />
            <button class="tool-action-btn" id="t-metro-btn" onclick="tToggleMetronome()" style="width:100%;">Start</button>
        </div>
        <div id="interval-tool" class="tool-content" style="display:none;">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">
                <div><label class="quad-title">Warm Up (s)</label><input type="number" class="tool-inp" id="t-int-warmup" value="0" min="0" /></div>
                <div><label class="quad-title">Sets</label><input type="number" class="tool-inp" id="t-int-sets" value="5" min="1" /></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;">
                <div><label class="quad-title">Work (s)</label><input type="number" class="tool-inp" id="t-int-work" value="30" min="1" /></div>
                <div><label class="quad-title">Rest (s)</label><input type="number" class="tool-inp" id="t-int-rest" value="15" min="0" /></div>
            </div>
            <div id="t-int-phase" style="text-align:center; font-family:'Montserrat'; font-weight:800; font-size:0.75rem; letter-spacing:1px; color:var(--brand-accent); margin-bottom:4px;">READY</div>
            <div id="t-int-display" style="font-size:3.5rem; font-family:'Courier New'; font-weight:bold; text-align:center; color:white; margin:6px 0;">00:30</div>
            <div id="t-int-sets-label" style="text-align:center; font-size:0.65rem; color:#555; margin-bottom:8px;"></div>
            <button class="tool-action-btn" id="t-int-btn" onclick="tToggleInterval()" style="width:100%;">Start</button>
        </div>
        <div id="countdown-tool" class="tool-content" style="display:none;">
            <label class="quad-title">Seconds</label>
            <input type="number" class="tool-inp" id="t-cd-input" value="60" min="1" oninput="if(!tCdRunning){tCdTime=parseInt(this.value)||60;tUpdateCDDisplay()}" />
            <div id="t-cd-display" style="font-size:4rem; font-family:'Courier New'; font-weight:bold; text-align:center; color:white; margin:12px 0;">01:00</div>
            <button class="tool-action-btn" id="t-cd-btn" onclick="tToggleCountdown()" style="width:100%;">Start</button>
        </div>
        <div id="stopwatch-tool" class="tool-content" style="display:none;">
            <div id="t-sw-display" style="font-size:4rem; font-family:'Courier New'; font-weight:bold; text-align:center; color:white; margin:12px 0;">00:00.00</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <button class="tool-action-btn" id="t-sw-btn" onclick="tToggleStopwatch()">Start</button>
                <button class="tool-action-btn" onclick="tResetStopwatch()">Reset</button>
            </div>
        </div>
    </div>
</div>

<script>
const pb = new PocketBase('https://restperiod.org');
let allPrograms = [], premadePrograms = [], currentProgram = null, currentWeekIndex = 0, masterExerciseList = [];
let tAudioCtx = null, tMetroPlaying = false, tMetroTimerID = null, tNextTick = 0;

window.onload = async () => {
    if (!pb.authStore.isValid) { window.location.href = 'index.html'; return; }
    runNavClock();
    await loadMasterLibrary();
    await fetchUserPrograms();
};

// ── LIBRARY ───────────────────────────────────────
async function loadMasterLibrary() {
    if (typeof exerciseDatabase !== 'undefined') masterExerciseList = [...exerciseDatabase];
    try {
        const recs = await pb.collection('custom_exercises').getFullList();
        recs.forEach(r => { if (!masterExerciseList.some(e => e.id === r.id)) masterExerciseList.push({ id: r.id, title: r.title, video: r.video, src: r.video }); });
    } catch(e) {}
}

// ── CLOCK ─────────────────────────────────────────
function runNavClock() {
    const canvas = document.getElementById('nav-clock');
    const ctx = canvas.getContext('2d');
    function draw() {
        const now = new Date(), ms = now.getMilliseconds(), sec = now.getSeconds(), min = now.getMinutes();
        ctx.clearRect(0,0,45,45); ctx.save(); ctx.translate(22.5,22.5);
        ctx.save(); ctx.rotate((min+sec/60)*(Math.PI/30)); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-14); ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.stroke(); ctx.restore();
        ctx.save(); ctx.rotate((sec+ms/1000)*(Math.PI/30)); ctx.beginPath(); ctx.moveTo(0,5); ctx.lineTo(0,-18); ctx.strokeStyle='#26C6DA'; ctx.lineWidth=1.5; ctx.stroke(); ctx.restore();
        ctx.restore(); requestAnimationFrame(draw);
    }
    draw();
}

// ── PROGRAMS ──────────────────────────────────────
async function fetchUserPrograms() {
    const urlParams = new URLSearchParams(window.location.search);
    const urlId = urlParams.get('id');
    const clientId = urlParams.get('clientId');
    const targetId = clientId || pb.authStore.model.id;

    if (clientId) {
        const banner = document.createElement('div');
        banner.style.cssText = 'background:#003B5C;border-bottom:1px solid #004d7a;padding:8px 20px;font-size:0.75rem;color:var(--brand-accent);display:flex;justify-content:space-between;align-items:center;';
        banner.innerHTML = `<span>📋 Logging as client</span><a href="dashboard.html" style="color:#888;font-size:0.7rem;">← Back to Dashboard</a>`;
        document.body.insertBefore(banner, document.body.firstChild);
    }

    try {
        const [ownRecs, templateRecs, freeRecs] = await Promise.all([
            pb.collection('programs').getFullList({ filter: `client="${targetId}" && archived=false`, sort: 'name', requestKey: null }),
            pb.collection('programs').getFullList({ filter: 'is_template=true && is_free=false && archived=false', sort: 'name', requestKey: null }),
            pb.collection('programs').getFullList({ filter: 'is_free=true && archived=false', sort: 'name', requestKey: null })
        ]);

        allPrograms = ownRecs;
        premadePrograms = [...templateRecs, ...freeRecs];

        document.getElementById('program-selector').innerHTML = ownRecs.length > 0
            ? ownRecs.map(p => `<option value="${p.id}">${p.name}</option>`).join('')
            : '<option value="">-- No programs assigned yet --</option>';

        document.getElementById('premade-selector').innerHTML =
            '<option value="">-- Browse premade programs --</option>' +
            premadePrograms.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

        if (urlId) {
            const inOwn = ownRecs.find(p => p.id === urlId);
            const inPremade = premadePrograms.find(p => p.id === urlId);
            if (inOwn) { document.getElementById('program-selector').value = urlId; loadSelectedProgram('own'); return; }
            if (inPremade) { document.getElementById('premade-selector').value = urlId; loadSelectedProgram('premade'); return; }
        }

        if (ownRecs.length > 0) loadSelectedProgram('own');
        else if (premadePrograms.length > 0) { document.getElementById('premade-selector').selectedIndex = 1; loadSelectedProgram('premade'); }

    } catch(e) { console.error('fetchUserPrograms error:', e); }
}

function loadSelectedProgram(source) {
    let id;
    if (source === 'own') {
        id = document.getElementById('program-selector').value;
        document.getElementById('premade-selector').selectedIndex = 0;
    } else {
        id = document.getElementById('premade-selector').value;
        if (!id) return;
        document.getElementById('program-selector').selectedIndex = -1;
    }
    if (!id) return;

    const prog = [...allPrograms, ...premadePrograms].find(p => p.id === id);
    if (!prog) return;
    currentProgram = prog;

    let data = currentProgram.workout_data;
    if (typeof data === 'string') data = JSON.parse(data);
    currentProgram.schedule = data.schedule || data;
    currentProgram.schedule = currentProgram.schedule.map((s, i) => ({ ...s, sessionNum: s.sessionNum || s.weekNum || i+1 }));
    currentProgram.schedule.forEach(w => { if (!w.warmup) w.warmup = []; if (!w.exercises) w.exercises = []; });
    currentWeekIndex = 0;
    renderTabs();
    renderContent();
    updateProgressBar();
}

function openExercisePreview(name) {
    const nameLower = name.trim().toLowerCase();

    function stripTags(t) {
        return t.replace(/^((?:[A-Z][A-Z0-9-]*)\s+)+/, '').trim().toLowerCase();
    }

    const match =
        masterExerciseList.find(ex => ex.title.toLowerCase() === nameLower) ||
        masterExerciseList.find(ex => stripTags(ex.title) === nameLower) ||
        masterExerciseList.find(ex => {
            const stripped = stripTags(ex.title);
            return stripped.includes(nameLower) || nameLower.includes(stripped);
        });

    if (!match) { alert('No video found for: ' + name); return; }

    const videoUrl = match.src || match.video || '';
    if (!videoUrl) { alert('No video available for this exercise.'); return; }

    const container = document.getElementById('video-player-content');
    if (videoUrl.includes('.mp4') || videoUrl.includes('.mov') || videoUrl.includes('pocketbase') || videoUrl.startsWith('videos/')) {
        container.innerHTML = `<video controls autoplay loop playsinline style="width:100%; display:block;"><source src="${videoUrl}" type="video/mp4"></video>`;
    } else {
        container.innerHTML = `<div style="position:relative; padding-bottom:56.25%; height:0;"><iframe src="${convertToEmbed(videoUrl)}" style="position:absolute; top:0; left:0; width:100%; height:100%;" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`;
    }
    document.getElementById('videoModal').style.display = 'block';
}
function convertToEmbed(url) {
    if (!url || url.includes('embed')) return url;
    let videoId = '';
    if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
    else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1];
    return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1` : url;
}

function closeVideoModal() {
    document.getElementById('videoModal').style.display = 'none';
    document.getElementById('video-player-content').innerHTML = '';
}

// ── SYNC ──────────────────────────────────────────
async function syncWorkoutToDB(msg) {
    const toast = document.getElementById('sync-toast');
    toast.innerText = msg; toast.style.display = 'block';
    try {
        await pb.collection('programs').update(currentProgram.id, { workout_data: JSON.stringify({ schedule: currentProgram.schedule }) });
    } catch(e) { console.error('Sync error:', e); }
    setTimeout(() => toast.style.display = 'none', 1500);
}

async function autoSaveSet(type, exIdx, setIdx, field, val) {
    currentProgram.schedule[currentWeekIndex][type][exIdx].setsData[setIdx][field] = val;
    await syncWorkoutToDB('Saving...'); updateProgressBar();
}

async function fillSetData(type, exIdx, setIdx, targetReps, targetWeight, targetRpe, isChecked) {
    if (!isChecked) return;
    const set = currentProgram.schedule[currentWeekIndex][type][exIdx].setsData[setIdx];
    const baseId = `${type}-${exIdx}-${setIdx}`;
    const inputReps = document.getElementById(`reps-${baseId}`);
    const inputWeight = document.getElementById(`weight-${baseId}`);
    const inputRpe = document.getElementById(`rpe-${baseId}`);
    if (!inputReps.value || inputReps.value == 0) { inputReps.value = targetReps; set.act_reps = targetReps; }
    if (!inputWeight.value || inputWeight.value == 0) { inputWeight.value = targetWeight; set.act_weight = targetWeight; }
    if (!inputRpe.value || inputRpe.value == 0) { inputRpe.value = parseFloat(targetRpe) ? targetRpe : ''; set.act_rpe = inputRpe.value; }
    await syncWorkoutToDB('Logged ✓'); updateProgressBar();
}

function updateProgressBar() {
    let total = 0, done = 0;
    currentProgram.schedule.forEach(w => {
        [...(w.warmup||[]), ...(w.exercises||[])].forEach(ex => ex.setsData.forEach(s => { total++; if (s.act_reps && s.act_weight) done++; }));
    });
    const p = Math.round((done/total)*100) || 0;
    document.getElementById('progress-bar').style.width = p + '%';
    document.getElementById('progress-percent').innerText = p + '%';
}

async function saveSessionDate(val) {
    currentProgram.schedule[currentWeekIndex].sessionDate = val;
    await syncWorkoutToDB('Date saved ✓');
    const badge = document.getElementById('session-date-badge');
    if (badge) {
        const str = val ? new Date(val).toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'}) : null;
        badge.innerHTML = str ? `<div class="date-completed">✓ COMPLETED ${str}</div>` : `<div class="date-not-logged">Not logged yet</div>`;
    }
    renderTabs();
}

function tSolvePace(){const dist=document.getElementById('t-pace-dist').value,tMin=document.getElementById('t-pace-min').value,tSec=document.getElementById('t-pace-sec').value,pMin=document.getElementById('t-pace-pace-min').value,pSec=document.getElementById('t-pace-pace-sec').value,speed=document.getElementById('t-pace-speed').value,out=document.getElementById('t-pace-output'),u=tPaceUnit;const hasTime=tMin!==''||tSec!=='',hasPace=pMin!==''||pSec!=='',hasDist=dist!=='',hasSpeed=speed!=='';const totalTimeSec=hasTime?(parseFloat(tMin)||0)*60+(parseFloat(tSec)||0):null,paceSec=hasPace?(parseFloat(pMin)||0)*60+(parseFloat(pSec)||0):null,distVal=hasDist?parseFloat(dist):null,speedVal=hasSpeed?parseFloat(speed):null;let d=distVal,t=totalTimeSec,p=paceSec,sp=speedVal;if(d&&t&&!p)p=t/d;if(d&&t&&!sp)sp=d/(t/3600);if(d&&p&&!t)t=d*p;if(d&&p&&!sp)sp=3600/p;if(d&&sp&&!t)t=(d/sp)*3600;if(d&&sp&&!p)p=3600/sp;if(t&&p&&!d)d=t/p;if(t&&p&&!sp)sp=3600/p;if(t&&sp&&!d)d=sp*(t/3600);if(t&&sp&&!p)p=3600/sp;if(!d||!t||!p||!sp){out.innerHTML='Fill in any 2 fields to solve.';out.style.display='block';return;}const pM=Math.floor(p/60),pS=Math.round(p%60),tH=Math.floor(t/3600),tM=Math.floor((t%3600)/60),tSS=Math.round(t%60),timeStr=tH>0?`${tH}h ${tM}m ${tSS}s`:`${tM}m ${tSS}s`;out.innerHTML=`Distance: <b style="color:var(--brand-accent)">${d.toFixed(2)} ${u}</b><br>Time: <b style="color:var(--brand-accent)">${timeStr}</b><br>Pace: <b style="color:var(--brand-accent)">${pM}:${String(pS).padStart(2,'0')} /${u}</b><br>Speed: <b style="color:var(--brand-accent)">${sp.toFixed(2)} ${u}/h</b>`;out.style.display='block';}

function tUpdateIntDisplay(){const m=Math.floor(tIntTime/60),s=tIntTime%60;document.getElementById('t-int-display').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function tSetIntPhase(phase,set,total){tIntPhase=phase;const label=document.getElementById('t-int-phase'),disp=document.getElementById('t-int-display'),sets=document.getElementById('t-int-sets-label');if(phase==='warmup'){label.textContent='WARM UP';label.style.color='#fb923c';disp.style.color='#fb923c';sets.textContent='';}else if(phase==='work'){label.textContent='WORK';label.style.color='#4ade80';disp.style.color='#4ade80';sets.textContent=`Set ${set} of ${total}`;}else if(phase==='rest'){label.textContent='REST';label.style.color='#f87171';disp.style.color='#f87171';sets.textContent=`Set ${set} of ${total}`;}else if(phase==='done'){label.textContent='DONE 🔥';label.style.color='var(--brand-accent)';disp.style.color='white';sets.textContent='';}}
function tToggleInterval(){const btn=document.getElementById('t-int-btn');if(tIntRunning){clearInterval(tIntInterval);tIntRunning=false;btn.textContent='Start';btn.classList.remove('running');tIntPhase='idle';document.getElementById('t-int-phase').textContent='READY';document.getElementById('t-int-phase').style.color='var(--brand-accent)';document.getElementById('t-int-display').style.color='white';document.getElementById('t-int-sets-label').textContent='';tIntTime=parseInt(document.getElementById('t-int-work').value)||30;tUpdateIntDisplay();return;}const warmup=parseInt(document.getElementById('t-int-warmup').value)||0,sets=parseInt(document.getElementById('t-int-sets').value)||5,work=parseInt(document.getElementById('t-int-work').value)||30,rest=parseInt(document.getElementById('t-int-rest').value)||15;tIntTotalSets=sets;tIntCurrentSet=1;tIntRunning=true;btn.textContent='Stop';btn.classList.add('running');if(warmup>0){tIntTime=warmup;tSetIntPhase('warmup',0,sets);}else{tIntTime=work;tSetIntPhase('work',1,sets);}tUpdateIntDisplay();tIntInterval=setInterval(()=>{tIntTime--;tUpdateIntDisplay();if(tIntTime>0)return;if(tIntPhase==='warmup'){tIntTime=work;tIntCurrentSet=1;tSetIntPhase('work',1,tIntTotalSets);}else if(tIntPhase==='work'){if(rest>0){tIntTime=rest;tSetIntPhase('rest',tIntCurrentSet,tIntTotalSets);}else{tIntCurrentSet++;if(tIntCurrentSet>tIntTotalSets){clearInterval(tIntInterval);tIntRunning=false;btn.textContent='Start';btn.classList.remove('running');tIntTime=0;tSetIntPhase('done',0,0);tUpdateIntDisplay();}else{tIntTime=work;tSetIntPhase('work',tIntCurrentSet,tIntTotalSets);}}}else if(tIntPhase==='rest'){tIntCurrentSet++;if(tIntCurrentSet>tIntTotalSets){clearInterval(tIntInterval);tIntRunning=false;btn.textContent='Start';btn.classList.remove('running');tIntTime=0;tSetIntPhase('done',0,0);tUpdateIntDisplay();}else{tIntTime=work;tSetIntPhase('work',tIntCurrentSet,tIntTotalSets);}}},1000);}
</script>

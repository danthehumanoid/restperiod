        .prog-card-body { padding: 8px 10px 10px; }

</head>

    loadUserProgress();
    renderLessons();

};

// ── TABS ──────────────────────────────────────────
function switchTab(tab) {
    document.querySelectorAll('.pill').forEach((p,i) => p.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    const tabs = ['train','philosophy','theory','start'];
    const idx = tabs.indexOf(tab);
    document.querySelectorAll('.pill')[idx].classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');
}

// ── USER PROGRESS (localStorage) ─────────────────
function loadUserProgress() {
    const uid = pb.authStore.model.id;
    const r = localStorage.getItem(`rp_read_${uid}`);
    const s = localStorage.getItem(`rp_saved_${uid}`);
    readLessons = r ? new Set(JSON.parse(r)) : new Set();
    savedLessons = s ? new Set(JSON.parse(s)) : new Set();
}

function saveUserProgress() {
    const uid = pb.authStore.model.id;
    localStorage.setItem(`rp_read_${uid}`, JSON.stringify([...readLessons]));
    localStorage.setItem(`rp_saved_${uid}`, JSON.stringify([...savedLessons]));
}

// ── RENDER LESSONS ────────────────────────────────
function renderLessons() {
    const grid = document.getElementById('lesson-grid');
    grid.innerHTML = CHAPTERS.map((ch, i) => {
        const isRead = readLessons.has(ch.num);
        const isSaved = savedLessons.has(ch.num);
        return `<div class="lesson-card ${isRead?'read':''} ${isSaved?'saved':''}" onclick="openLesson(${i})">
            <i class="fas fa-check check-icon"></i>
            <div class="lesson-num">${String(ch.num).padStart(2,'0')}</div>
            <div class="lesson-label" style="font-size:0.7rem;font-weight:700;color:#aaa;line-height:1.3;margin-top:4px;">${ch.title}</div>
            <div class="lesson-badges">
                ${isRead ? '<span class="badge-read">✓ Read</span>' : ''}
                ${isSaved ? '<span class="badge-saved">Saved</span>' : ''}
            </div>
        </div>`;
    }).join('');
}

// ── RENDER THEORY ─────────────────────────────────
function renderTheory() {
    const grid = document.getElementById('theory-grid');
    const colours = ['#1a0a3a','#001a0a','#1a0a00','#001a2c','#1a0a2a','#0a001a'];
    grid.innerHTML = THEORY_ITEMS.map((t,i) => {
        const hasFile = !!t.file;
        const onclick = hasFile ? `openTheoryLesson('${t.file}','${t.title}')` : `showToast('Coming soon!')`;
        const comingSoon = hasFile ? '' : `<span class="theory-coming">Coming soon</span>`;
        const cardStyle = hasFile ? '' : 'opacity:0.6;';
        return `<div class="theory-card" style="${cardStyle}" onclick="${onclick}">
            ${comingSoon}
            <div class="theory-thumb" style="background:${colours[i%colours.length]};"></div>
            <div class="theory-body">
                <div class="theory-tag">${t.tag}</div>
                <div class="theory-title">${t.title}</div>
            </div>
        </div>`;
    }).join('');
}

function openTheoryLesson(file, title) {
    const filename = file.endsWith('.html') ? file : file + '.html';
    document.getElementById('reader-lesson-num').textContent = title;
    document.getElementById('reader-frame').src = filename;
    document.getElementById('reader-save-btn').style.display = 'none';
    document.getElementById('reader-prev').style.display = 'none';
    document.getElementById('reader-next').style.display = 'none';
    document.getElementById('reader-mark-btn').style.display = 'none';
    document.getElementById('reader-modal').classList.add('open');
}

// ── LESSON READER ─────────────────────────────────
function openLesson(index) {
    currentLessonIndex = index;
    const ch = CHAPTERS[index];
    document.getElementById('reader-lesson-num').textContent = `Lesson ${ch.num}`;
    document.getElementById('reader-frame').src = ch.file;
    updateReaderUI();
    document.getElementById('reader-modal').classList.add('open');
}

function closeReader() {
    document.getElementById('reader-modal').classList.remove('open');
    document.getElementById('reader-frame').src = 'about:blank';
    // Restore buttons for philosophy reader
    document.getElementById('reader-save-btn').style.display = '';
    document.getElementById('reader-prev').style.display = '';
    document.getElementById('reader-next').style.display = '';
    document.getElementById('reader-mark-btn').style.display = '';
    renderLessons();
}

function updateReaderUI() {
    const ch = CHAPTERS[currentLessonIndex];
    const isRead = readLessons.has(ch.num);
    const isSaved = savedLessons.has(ch.num);
    const markBtn = document.getElementById('reader-mark-btn');
    markBtn.textContent = isRead ? '✓ Marked as Read' : 'Mark as Read';
    markBtn.className = `btn-mark-read ${isRead ? 'read' : 'unread'}`;
    const saveBtn = document.getElementById('reader-save-btn');
    const saveLabel = document.getElementById('reader-save-label');
    saveLabel.textContent = isSaved ? 'Saved' : 'Save';
    saveBtn.className = `reader-save-btn ${isSaved ? 'saved' : ''}`;
    document.getElementById('reader-prev').disabled = currentLessonIndex === 0;
    document.getElementById('reader-next').disabled = currentLessonIndex === CHAPTERS.length - 1;
    document.getElementById('reader-lesson-num').textContent = `Lesson ${ch.num} of ${CHAPTERS.length}`;
}

function toggleMarkRead() {
    const ch = CHAPTERS[currentLessonIndex];
    if (readLessons.has(ch.num)) readLessons.delete(ch.num);
    else readLessons.add(ch.num);
    saveUserProgress();
    updateReaderUI();
    showToast(readLessons.has(ch.num) ? '✓ Marked as read' : 'Unmarked');
}

function toggleSaveLesson() {
    const ch = CHAPTERS[currentLessonIndex];
    if (savedLessons.has(ch.num)) {
        savedLessons.delete(ch.num);
        showToast('Removed from saved');
    } else {
        savedLessons.add(ch.num);
        showToast('Saved to your library');
    }
    saveUserProgress();
    updateReaderUI();
}

function navigateLesson(dir) {
    const next = currentLessonIndex + dir;
    if (next < 0 || next >= CHAPTERS.length) return;
    currentLessonIndex = next;
    const ch = CHAPTERS[currentLessonIndex];
    document.getElementById('reader-frame').src = ch.file;
    updateReaderUI();
}

// ── TRAIN — FREE PROGRAMS ─────────────────────────
async function loadTrainPrograms() {
    try {
        const recs = await pb.collection('programs').getFullList({
            filter: 'is_free=true && archived=false', sort: 'name', requestKey: null
        });
        freeMasterPrograms = recs;
        renderTrainShelves();
    } catch(e) { console.error(e); }
}

function renderTrainShelves() {
    const container = document.getElementById('train-shelves');
    if (!freeMasterPrograms.length) {
        container.innerHTML = '<div style="text-align:center;padding:60px 0;color:#555;">No programs yet.</div>';
        return;
    }
    const grouped = {};
    freeMasterPrograms.forEach(p => {
        const cat = (p.category||'OTHER').toUpperCase();
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(p);
    });
    const sortedCats = Object.keys(grouped).sort((a,b) => {
        const ai=CATEGORY_ORDER.indexOf(a), bi=CATEGORY_ORDER.indexOf(b);
        return (ai===-1?99:ai)-(bi===-1?99:bi);
    });
    container.innerHTML = sortedCats.map(cat => {
        const meta = CATEGORY_META[cat]||CATEGORY_META.OTHER;
        const progs = grouped[cat];
        return `<div class="shelf-section">
            <div class="shelf-header">
                <span class="shelf-title" style="color:${meta.color};">${meta.label}</span>
                <div class="shelf-line"></div>
                <span class="shelf-count">${progs.length}</span>
            </div>
            <div class="shelf-scroll-wrap">
                <div class="shelf-track">
                    ${progs.map(p => buildProgCard(p)).join('')}
                </div>
            </div>
        </div>`;
    }).join('');
}

function buildProgCard(p) {
    const cat = (p.category||'OTHER').toUpperCase();
    const meta = CATEGORY_META[cat]||CATEGORY_META.OTHER;
    let data = p.workout_data;
    try { if (typeof data==='string') data=JSON.parse(data); } catch(e) {}
    const schedule = data?.schedule||data||[];
    const sessionCount = Array.isArray(schedule)?schedule.length:0;
    const thumbHtml = p.cover_image
        ? `<img class="prog-thumb" src="${PB_URL}/api/files/programs/${p.id}/${p.cover_image}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="prog-thumb-placeholder ${meta.thumbClass}" style="display:none;"></div>`
        : `<div class="prog-thumb-placeholder ${meta.thumbClass}"></div>`;
    return `<div class="prog-card" onclick="openProgModal('${p.id}')">
        ${thumbHtml}
        <div class="prog-card-body">
            <div class="prog-name">${p.name}</div>
            <div class="prog-badge">${p.is_repeatable?'Repeatable':sessionCount+' sessions'}</div>
        </div>
    </div>`;
}

function openProgModal(id) {
    const p = freeMasterPrograms.find(x=>x.id===id); if (!p) return;
    const cat = (p.category||'OTHER').toUpperCase();
    const meta = CATEGORY_META[cat]||CATEGORY_META.OTHER;
    let data = p.workout_data;
    try { if (typeof data==='string') data=JSON.parse(data); } catch(e) {}
    const schedule = data?.schedule||data||[];
    const sessionCount = Array.isArray(schedule)?schedule.length:0;
    const thumbHtml = p.cover_image
        ? `<img class="prog-modal-thumb" src="${PB_URL}/api/files/programs/${p.id}/${p.cover_image}" onerror="this.style.display='none'">`
        : `<div class="prog-modal-thumb ${meta.thumbClass}" style="display:flex;align-items:center;justify-content:center;font-size:3rem;border-radius:8px;"></div>`;
    document.getElementById('prog-modal-content').innerHTML = `
        ${thumbHtml}
        <div class="prog-modal-title">${p.name}</div>
        <div class="prog-modal-desc">${p.description||'No description available.'}</div>
        <div class="prog-modal-meta">
            <span>${meta.label}</span>
            <span>${p.is_repeatable?'Repeatable':sessionCount+' sessions'}</span>
        </div>
        <button class="btn-start" onclick="startProgram('${p.id}')">▶ Start This Program</button>
        <button class="btn-modal-close" onclick="closeProgModal()">Close</button>`;
    document.getElementById('prog-modal').classList.add('open');
}

function closeProgModal() { document.getElementById('prog-modal').classList.remove('open'); }

async function startProgram(templateId) {
    const template = freeMasterPrograms.find(p=>p.id===templateId); if (!template) return;
    try {
        const newProg = await pb.collection('programs').create({
            name: template.name, client: pb.authStore.model.id,
            workout_data: template.workout_data, is_free: false,
            is_repeatable: template.is_repeatable||false, category: template.category||'', archived: false
        });
        closeProgModal();
        showToast('Program started');
        setTimeout(() => { window.location.href = `program.html?id=${newProg.id}`; }, 1000);
    } catch(e) { alert('Failed: '+e.message); }
}

// ── TOAST ─────────────────────────────────────────
let toastTimer;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.style.display='none', 2000);
}
</script>

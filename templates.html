<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Builder | RestPeriod</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.3/pocketbase.umd.min.js"></script>
    <script src="exercises.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap');
        :root { --brand-bg: #020c12; --card-bg: #0e1b24; --brand-accent: #26C6DA; --brand-secondary: #2E7D32; --text-main: #E0F7FA; --input-bg: #002840; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Open Sans', sans-serif; background: var(--brand-bg); color: var(--text-main); padding-bottom: 60px; }

        .nav-top { display: flex; justify-content: space-between; padding: 15px 25px; background: #000; border-bottom: 1px solid #004d7a; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .nav-brand { font-weight: 800; font-size: 1.2rem; font-family: 'Montserrat'; }
        .nav-brand span { color: var(--brand-accent); }
        .nav-links a { color: #888; text-decoration: none; margin-left: 20px; font-family: 'Montserrat'; font-weight: 700; font-size: 0.8rem; transition: 0.2s; }
        .nav-links a:hover { color: var(--brand-accent); }
        .nav-links a.active { color: white; border-bottom: 2px solid var(--brand-accent); }

        .page { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 65px); }
        @media (max-width: 900px) { .page { grid-template-columns: 1fr; } }

        /* SIDEBAR */
        .sidebar { background: #000; border-right: 1px solid #0a1a25; padding: 16px; overflow-y: auto; height: calc(100vh - 65px); position: sticky; top: 65px; }
        .vault-search { width: 100%; background: var(--input-bg); border: 1px solid #004d7a; color: white; padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; font-family: inherit; margin-bottom: 12px; }
        .vault-search:focus { outline: none; border-color: var(--brand-accent); }
        .filter-section { margin-bottom: 12px; }
        .filter-section-title { font-family: 'Montserrat'; font-size: 0.55rem; font-weight: 800; color: var(--brand-accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .filter-tags { display: flex; flex-wrap: wrap; gap: 4px; }
        .filter-tag { padding: 3px 8px; background: transparent; border: 1px solid #1a2a35; color: #555; border-radius: 20px; cursor: pointer; font-size: 0.58rem; font-weight: 800; font-family: 'Montserrat'; transition: 0.2s; text-transform: uppercase; }
        .filter-tag:hover { border-color: var(--brand-accent); color: var(--brand-accent); }
        .filter-tag.active { background: var(--brand-accent); border-color: var(--brand-accent); color: #000; }
        .filter-clear { width: 100%; padding: 6px; background: none; border: 1px solid #1a2a35; color: #555; border-radius: 4px; cursor: pointer; font-size: 0.6rem; font-family: 'Montserrat'; font-weight: 800; margin-top: 6px; transition: 0.2s; }
        .filter-clear:hover { border-color: #ff5252; color: #ff5252; }
        .lib-result { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-bottom: 1px solid #1a2a35; transition: 0.2s; }
        .lib-result:hover { background: rgba(255,255,255,0.04); }
        .lib-result-name { font-size: 0.78rem; font-weight: 600; color: #E0F7FA; flex: 1; line-height: 1.3; }
        .add-btn { background: transparent; border: 1px solid var(--brand-accent); color: var(--brand-accent); padding: 3px 8px; font-size: 0.58rem; font-weight: 800; cursor: pointer; border-radius: 3px; font-family: 'Montserrat'; transition: 0.2s; white-space: nowrap; margin-left: 6px; }
        .add-btn:hover { background: var(--brand-accent); color: #000; }

        /* MAIN */
        .main { padding: 20px; overflow-y: auto; }

        /* TABS */
        .tab-bar { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
        .tab { padding: 8px 16px; background: #001a2c; border: 1px solid #333; cursor: pointer; border-radius: 4px; font-size: 0.8rem; color: #888; font-weight: 700; white-space: nowrap; transition: 0.2s; font-family: 'Montserrat'; }
        .tab.active { background: var(--brand-accent); color: #000; font-weight: 800; }
        .tab-add { padding: 8px 14px; background: transparent; border: 1px solid #333; cursor: pointer; border-radius: 4px; color: #555; font-size: 1rem; transition: 0.2s; }
        .tab-add:hover { border-color: var(--brand-accent); color: var(--brand-accent); }

        /* CARDS */
        .card { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid #004d7a; margin-bottom: 16px; }
        h3 { color: var(--brand-accent); font-family: 'Montserrat'; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; }

        input, select { width: 100%; padding: 10px 12px; background: var(--input-bg); border: 1px solid #004d7a; color: white; border-radius: 4px; margin-bottom: 12px; font-size: 0.9rem; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: var(--brand-accent); }
        label { font-size: 0.6rem; color: #aaa; text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 4px; font-family: 'Montserrat'; }

        .btn { padding: 11px 16px; border: none; border-radius: 4px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-family: 'Montserrat'; font-size: 0.72rem; transition: 0.2s; width: 100%; }
        .btn-green { background: var(--brand-secondary); color: white; }
        .btn-green:hover { background: #388E3C; }
        .btn-outline { background: transparent; border: 1px solid var(--brand-accent); color: var(--brand-accent); }
        .btn-outline:hover { background: var(--brand-accent); color: #000; }
        .btn-danger { background: transparent; border: 1px solid #ff5252; color: #ff5252; }
        .btn-sm { padding: 6px 12px; width: auto; font-size: 0.65rem; }

        /* SECTION DIVIDERS */
        .section-div { background: #000; padding: 10px 14px; border-radius: 4px; margin: 16px 0 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--brand-accent); }
        .section-div.main { border-left-color: var(--brand-secondary); }

        /* EXERCISE ITEMS */
        .exercise-item { background: #001a2c; padding: 14px; border-radius: 6px; border: 1px solid #333; margin-bottom: 12px; }
        .ex-title { font-family: 'Montserrat'; font-weight: 800; color: var(--brand-accent); font-size: 1rem; text-transform: uppercase; }
        .metrics-grid { display: grid; grid-template-columns: 0.5fr 1fr 1fr 1fr 1fr 0.3fr; gap: 5px; margin-top: 8px; align-items: center; }
        .metric-col { text-align: center; }
        .metric-col label { font-size: 0.5rem; color: var(--brand-accent); margin-bottom: 2px; }
        .metric-col input { text-align: center; padding: 6px; margin-bottom: 0; font-size: 0.85rem; }

        /* SAVED TEMPLATES */
        .saved-section-title { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #1a2a35; font-family: 'Montserrat'; }
        .saved-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1a2a35; align-items: center; }
        .saved-row-name { font-size: 0.82rem; color: #eee; flex: 1; }
        .saved-badge { font-size: 0.55rem; padding: 2px 6px; border-radius: 10px; font-family: 'Montserrat'; font-weight: 800; margin-left: 6px; text-transform: uppercase; }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 6000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--card-bg); border: 1px solid var(--brand-accent); border-radius: 12px; padding: 24px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
        .modal-tag-btn { padding: 4px 10px; background: transparent; border: 1px solid #1a2a35; color: #555; border-radius: 20px; cursor: pointer; font-size: 0.6rem; font-weight: 800; font-family: 'Montserrat'; transition: 0.2s; text-transform: uppercase; }
        .modal-tag-btn.active { background: var(--brand-accent); border-color: var(--brand-accent); color: #000; }
        .modal-group-title { font-size: 0.5rem; color: var(--brand-accent); font-weight: 800; margin: 10px 0 5px; font-family: 'Montserrat'; text-transform: uppercase; }

        /* TOAST */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #052e16; border: 1px solid #166534; color: #4ade80; padding: 8px 20px; border-radius: 50px; font-size: 0.75rem; font-weight: 800; font-family: 'Montserrat'; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    </style>
</head>
<body>

<div class="nav-top">
    <div class="nav-brand">REST <span>PERIOD</span></div>
    <div class="nav-links">
        <a href="dashboard.html">DASHBOARD</a>
        <a href="builder.html">BUILDER</a>
        <a href="library.html">LIBRARY</a>
        <a href="templates.html" class="active">TEMPLATES</a>
        <a href="#" onclick="pb.authStore.clear(); window.location.href='index.html'">LOGOUT</a>
    </div>
</div>

<div class="page">

    <!-- SIDEBAR VAULT -->
    <div class="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="font-family:'Montserrat'; font-weight:800; font-size:0.8rem; color:var(--brand-accent);">VAULT</span>
            <button class="btn btn-outline btn-sm" onclick="openAddModal()">+ NEW</button>
        </div>
        <input type="text" class="vault-search" id="vault-search" placeholder="Search exercises..." oninput="renderVault()">
        <div id="filter-groups"></div>
        <button class="filter-clear" onclick="clearFilters()">✕ Clear Filters</button>
        <div id="vault-results" style="margin-top:10px; border:1px solid #1a2a35; border-radius:4px; max-height:350px; overflow-y:auto;"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">

        <!-- BUILDER CARD -->
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
                <h3 style="margin:0;">Template Builder</h3>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-outline btn-sm" onclick="resetBuilder()">Clear</button>
                </div>
            </div>

            <!-- META -->
            <div style="display:grid; grid-template-columns:2fr 1fr; gap:12px; margin-bottom:16px;">
                <div>
                    <label>Template Name</label>
                    <input type="text" id="template-name" placeholder="e.g. Lower Body Strength Block">
                </div>
                <div>
                    <label>Template Type</label>
                    <select id="template-type" onchange="onTypeChange()">
                        <option value="full">Full Program (multi-session)</option>
                        <option value="warmup">Warm Up Section</option>
                        <option value="workout">Main Workout Section</option>
                    </select>
                </div>
            </div>

            <!-- FLAGS -->
            <div style="display:flex; gap:20px; margin-bottom:16px; flex-wrap:wrap;">
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.7rem; color:#888; text-transform:none;">
        <input type="checkbox" id="is-premade" style="width:auto; margin:0;"> Premade (coaches can load into builder)
    </label>
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.7rem; color:#888; text-transform:none;">
        <input type="checkbox" id="is-free" style="width:auto; margin:0;"> Free (clients can browse and claim)
    </label>
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.7rem; color:#26C6DA; text-transform:none;" title="Repeatable sessions can be logged multiple times — great for circuits done weekly">
        <input type="checkbox" id="is-repeatable" style="width:auto; margin:0;"> 🔁 Repeatable Session
    </label>
</div>

            <!-- SESSION TABS (full only) -->
            <div id="session-tabs-area" style="margin-bottom:16px;">
                <div class="tab-bar" id="tab-bar"></div>
            </div>
<div style="margin-bottom:16px;">
    <label>Session Description</label>
    <input type="text" id="session-desc" placeholder="e.g. Focus on control and depth today." onchange="sessions[currentSession].description=this.value">
</div>
<div style="display:flex; gap:8px; margin-bottom:16px;">
    <button class="btn btn-outline btn-sm" onclick="copyToPrevSession()">⬅ Copy From Previous</button>
    <button class="btn btn-danger btn-sm" onclick="deleteCurrentSession()">✕ Delete Session</button>
</div>
            <!-- SECTION TYPE (section templates only) -->
            <div id="section-type-area" style="display:none; margin-bottom:10px;">
                <label>Section</label>
                <select id="section-type">
                    <option value="warmup">Warm Up</option>
                    <option value="workout">Main Workout</option>
                </select>
            </div>

            <!-- WARMUP -->
            <div id="warmup-area">
                <div class="section-div">
                    <span style="font-family:'Montserrat'; font-weight:800; font-size:0.8rem;"><i class="fas fa-fire"></i> WARM UP</span>
                </div>
                <div id="warmup-list"></div>
            </div>

            <!-- MAIN WORKOUT -->
            <div id="workout-area">
                <div class="section-div main">
                    <span style="font-family:'Montserrat'; font-weight:800; font-size:0.8rem;"><i class="fas fa-dumbbell"></i> MAIN WORKOUT</span>
                </div>
                <div id="workout-list"></div>
            </div>

            <!-- SAVE -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">
                <button class="btn btn-green" id="save-btn" onclick="saveTemplate()">💾 SAVE TEMPLATE</button>
                <button class="btn btn-danger" onclick="resetBuilder()">✕ CLEAR</button>
            </div>
        </div>

        <!-- SAVED TEMPLATES -->
        <div class="card">
            <h3>Saved Templates</h3>

            <div class="saved-section-title" style="color:#ff9800;">📦 Full Programs</div>
            <div id="list-full"></div>

            <div class="saved-section-title" style="color:#ff9800;">🔥 Warm Up Sections</div>
            <div id="list-warmup"></div>

            <div class="saved-section-title" style="color:var(--brand-accent);">💪 Main Workout Sections</div>
            <div id="list-workout"></div>
        </div>

    </div>
</div>

<!-- ADD EXERCISE MODAL -->
<div class="modal-overlay" id="add-modal" onclick="if(event.target===this)closeAddModal()">
    <div class="modal">
        <h3>Add to Vault</h3>
        <label>Exercise Name</label>
        <input type="text" id="new-ex-name" placeholder="e.g. Goblet squat">
        <label>Tags</label>
        <div id="modal-tags" style="background:rgba(0,0,0,0.3); padding:12px; border-radius:6px; margin-bottom:12px; max-height:280px; overflow-y:auto;"></div>
        <label>Video URL <span style="color:#555; font-size:0.55rem;">(optional — leave blank for NO-VIDEO)</span></label>
        <input type="text" id="new-ex-video" placeholder="YouTube URL or leave blank">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px;">
            <button class="btn btn-green" onclick="saveNewExercise()">Save</button>
            <button class="btn btn-outline" onclick="closeAddModal()">Cancel</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    (function() {
    const pb2 = new PocketBase('https://restperiod.org');
    if (!pb2.authStore.isValid) { window.location.href = '/index.html'; return; }
    const role = pb2.authStore.model.role;
    if (role !== 'trainer' && role !== 'admin') { window.location.href = '/index.html'; }
})();
const pb = new PocketBase('https://restperiod.org');

const KNOWN_TAGS = [
    'PUSH','PULL','SQUAT','HINGE','CORE','PLYO','RUN','MOBILITY','PRIMER','RECOVERY','SKILLS',
    'HORIZONTAL','VERTICAL','LATERAL','ANTERIOR','POSTERIOR','SIDE','MIXED','TOTAL-CORE-STABILITY',
    'DOUBLE-ARM','SINGLE-ARM','DOUBLE-LEG','SINGLE-LEG','SPLIT-STANCE','FULL-BODY',
    'UPPER-BODY','LOWER-BODY','FOOT','ANKLE','KNEE','HIP','SPINE','SHOULDER','ELBOW','WRIST','NECK',
    'BODYWEIGHT','DUMBBELL','BARBELL','KETTLEBELL','BAND','WEIGHTED','TRAP-BAR'
];

const filterGroups = {
    'MOVEMENT':  ['PUSH','PULL','SQUAT','HINGE','CORE','PLYO','RUN','MOBILITY','PRIMER','RECOVERY','SKILLS'],
    'DIRECTION': ['HORIZONTAL','VERTICAL','LATERAL','ANTERIOR','POSTERIOR','SIDE','MIXED','TOTAL-CORE-STABILITY'],
    'LIMBS':     ['DOUBLE-ARM','SINGLE-ARM','DOUBLE-LEG','SINGLE-LEG','SPLIT-STANCE','FULL-BODY'],
    'BODY PART': ['UPPER-BODY','LOWER-BODY'],
    'JOINT':     ['FOOT','ANKLE','KNEE','HIP','SPINE','SHOULDER','ELBOW','WRIST','NECK'],
    'EQUIPMENT': ['BODYWEIGHT','DUMBBELL','BARBELL','KETTLEBELL','BAND','WEIGHTED','TRAP-BAR']
};

function cleanTitle(title) {
    const pat = new RegExp(`^((?:${KNOWN_TAGS.map(t => t.replace(/-/g,'[- ]')).join('|')})\\s+)+`, 'i');
    return title.replace(pat, '').trim() || title;
}

// ── STATE ─────────────────────────────────────────
let activeFilters = new Set();
let modalTags = [];
let editingId = null;
let currentSession = 0;

// sessions array — each: { sessionNum, warmup:[], exercises:[] }
let sessions = [{ sessionNum: 1, warmup: [], exercises: [] }];

// ── INIT ──────────────────────────────────────────
window.onload = async () => {
    if (!pb.authStore.isValid) { window.location.href = 'index.html'; return; }
    buildFilterUI();
    await loadCustomExercises();
    await fetchSavedTemplates();
    renderVault();
    renderTabs();
    renderSections();
    onTypeChange();
};

// ── TYPE CHANGE ───────────────────────────────────
function onTypeChange() {
    const type = document.getElementById('template-type').value;
    const isFull = type === 'full';
    document.getElementById('session-tabs-area').style.display = isFull ? 'block' : 'none';
    document.getElementById('warmup-area').style.display = isFull || type === 'warmup' ? 'block' : 'none';
    document.getElementById('workout-area').style.display = isFull || type === 'workout' ? 'block' : 'none';
}

// ── TABS ──────────────────────────────────────────
function renderTabs() {
    const bar = document.getElementById('tab-bar');
    bar.innerHTML = sessions.map((s, i) =>
        `<div class="tab ${i === currentSession ? 'active' : ''}" onclick="switchSession(${i})">Sn ${s.sessionNum}</div>`
    ).join('') + `<button class="tab-add" onclick="addSession()">+</button>`;
}

function switchSession(i) {
    currentSession = i;
    renderTabs();
    renderSections();
}

function addSession() {
    sessions.push({ sessionNum: sessions.length + 1, warmup: [], exercises: [], description: '' });
    currentSession = sessions.length - 1;
    renderTabs();
    renderSections();
}

function deleteCurrentSession() {
    if (sessions.length <= 1) return alert('Need at least one session.');
    if (!confirm(`Delete Session ${sessions[currentSession].sessionNum}?`)) return;
    sessions.splice(currentSession, 1);
    sessions.forEach((s, i) => s.sessionNum = i + 1);
    if (currentSession >= sessions.length) currentSession = sessions.length - 1;
    renderTabs();
    renderSections();
}

// ── RENDER SECTIONS ───────────────────────────────
function renderSections() {
    const s = sessions[currentSession];
    document.getElementById('session-desc').value = s.description || '';
    renderList('warmup-list', s.warmup, 'warmup');
    renderList('workout-list', s.exercises, 'exercises');
}

function renderList(containerId, list, type) {
    const el = document.getElementById(containerId);
    if (!list.length) {
        el.innerHTML = `<div style="color:#333; font-size:0.75rem; padding:12px; text-align:center;">No exercises yet — add from the Vault.</div>`;
        return;
    }
    el.innerHTML = list.map((ex, i) => `
        <div class="exercise-item">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <div style="display:flex; flex-direction:column; gap:2px;">
                        <i class="fas fa-chevron-up" style="cursor:pointer; font-size:0.7rem; color:var(--brand-accent); opacity:0.6;" onclick="moveEx('${type}',${i},-1)"></i>
                        <i class="fas fa-chevron-down" style="cursor:pointer; font-size:0.7rem; color:var(--brand-accent); opacity:0.6;" onclick="moveEx('${type}',${i},1)"></i>
                    </div>
                    <div class="ex-title">${ex.name}</div>
                </div>
                <i class="fas fa-trash" style="color:#555; cursor:pointer;" onclick="removeEx('${type}',${i})"></i>
            </div>
            <div style="display:flex; gap:8px; margin-bottom:8px;">
                <input type="text" placeholder="Group (e.g. A1)" value="${(ex.grouping||'').replace(/"/g,'&quot;')}" onchange="sessions[currentSession].${type}[${i}].grouping=this.value" style="width:110px; padding:6px; margin-bottom:0;">
                <input type="text" placeholder="Notes..." value="${(ex.notes||'').replace(/"/g,'&quot;')}" onchange="sessions[currentSession].${type}[${i}].notes=this.value" style="flex:1; padding:6px; margin-bottom:0;">
            </div>
            ${ex.setsData.map((s, si) => `
                <div class="metrics-grid" style="grid-template-columns: 0.5fr 1fr 1fr 1fr 1fr 1fr 0.3fr;">
    <div class="metric-col"><label>SET ${si+1}</label></div>
    <div class="metric-col"><label>REPS</label><input type="text" value="${s.reps||''}" onchange="sessions[currentSession].${type}[${i}].setsData[${si}].reps=this.value"></div>
    <div class="metric-col"><label>KG</label><input type="text" value="${s.weight||''}" onchange="sessions[currentSession].${type}[${i}].setsData[${si}].weight=this.value"></div>
    <div class="metric-col"><label>REST</label><input type="text" value="${s.rest||''}" placeholder="90s" onchange="sessions[currentSession].${type}[${i}].setsData[${si}].rest=this.value"></div>
    <div class="metric-col"><label>TEMPO</label><input type="text" value="${s.tempo||''}" onchange="sessions[currentSession].${type}[${i}].setsData[${si}].tempo=this.value"></div>
    <div class="metric-col"><label>RPE</label><input type="text" value="${s.rpe||''}" onchange="sessions[currentSession].${type}[${i}].setsData[${si}].rpe=this.value"></div>
    <i class="fas fa-minus-circle" style="color:#b71c1c; cursor:pointer; align-self:center;" onclick="sessions[currentSession].${type}[${i}].setsData.splice(${si},1); renderSections();"></i>
</div>`).join('')}
            <button class="btn btn-outline" style="padding:5px 10px; font-size:0.6rem; width:auto; margin-top:10px;" onclick="sessions[currentSession].${type}[${i}].setsData.push({...sessions[currentSession].${type}[${i}].setsData.slice(-1)[0]}); renderSections();">+ SET</button>
        </div>`).join('');
}

function addToSession(name, type) {
    sessions[currentSession][type].push({
        name: cleanTitle(name),
        grouping: '', notes: '',
        setsData: [{ reps: '10', weight: '0', rest: '', tempo: '//', rpe: '7' }]
    });
    renderSections();
    showToast(`Added to ${type === 'warmup' ? 'Warm Up' : 'Main Workout'}`);
}

function removeEx(type, i) {
    sessions[currentSession][type].splice(i, 1);
    renderSections();
}

function moveEx(type, i, dir) {
    const list = sessions[currentSession][type];
    if (i+dir < 0 || i+dir >= list.length) return;
    [list[i], list[i+dir]] = [list[i+dir], list[i]];
    renderSections();
}

// ── VAULT ─────────────────────────────────────────
function buildFilterUI() {
    document.getElementById('filter-groups').innerHTML = Object.entries(filterGroups).map(([group, tags]) => `
        <div class="filter-section">
            <div class="filter-section-title">${group}</div>
            <div class="filter-tags">
                ${tags.map(tag => `<button class="filter-tag" data-tag="${tag}" onclick="toggleFilter('${tag}')">${tag.replace(/-/g,' ')}</button>`).join('')}
            </div>
        </div>`).join('');
}
function copyToPrevSession() {
    if (currentSession === 0) return alert('No previous session to copy from.');
    if (!confirm('Copy exercises from previous session into this one?')) return;
    const prev = sessions[currentSession - 1];
    sessions[currentSession].warmup = JSON.parse(JSON.stringify(prev.warmup));
    sessions[currentSession].exercises = JSON.parse(JSON.stringify(prev.exercises));
    renderSections();
    showToast('Copied from Session ' + (currentSession));
}
function toggleFilter(tag) {
    activeFilters.has(tag) ? activeFilters.delete(tag) : activeFilters.add(tag);
    document.querySelectorAll(`.filter-tag[data-tag="${tag}"]`).forEach(el => el.classList.toggle('active', activeFilters.has(tag)));
    renderVault();
}

function clearFilters() {
    activeFilters.clear();
    document.querySelectorAll('.filter-tag').forEach(el => el.classList.remove('active'));
    renderVault();
}

function renderVault() {
    const q = (document.getElementById('vault-search').value || '').toLowerCase().trim();
    const results = (typeof exerciseDatabase !== 'undefined' ? exerciseDatabase : [])
        .filter(e => {
            const search = (e.searchStr || e.title || '').toLowerCase();
            const matchText = !q || search.includes(q) || (e.title||'').toLowerCase().includes(q);
            const matchTags = activeFilters.size === 0 || Array.from(activeFilters).every(tag =>
                new RegExp(`\\b${tag.replace(/-/g,'[- ]')}\\b`, 'i').test(search)
            );
            return matchText && matchTags;
        })
        .sort((a, b) => cleanTitle(a.title).localeCompare(cleanTitle(b.title)));

    const el = document.getElementById('vault-results');
    if (!results.length) {
        el.innerHTML = '<div style="color:#333; font-size:0.75rem; padding:16px; text-align:center;">No exercises found</div>';
        return;
    }
    el.innerHTML = results.slice(0, 80).map(e => {
        const safe = e.title.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        return `<div class="lib-result">
            <div class="lib-result-name">${cleanTitle(e.title)}</div>
            <div style="display:flex; gap:4px;">
                <button class="add-btn" onclick="addToSession('${safe}','warmup')">+ W</button>
                <button class="add-btn" onclick="addToSession('${safe}','exercises')">+ M</button>
            </div>
        </div>`;
    }).join('');
}

async function loadCustomExercises() {
    try {
        const recs = await pb.collection('custom_exercises').getFullList({ requestKey: null });
        recs.forEach(r => {
            if (!exerciseDatabase.some(e => e.id === r.id))
                exerciseDatabase.push({ id: r.id, title: r.title, searchStr: r.searchStr || r.title });
        });
    } catch(e) {}
}

// ── SAVE / LOAD ───────────────────────────────────
async function saveTemplate() {
    const name = document.getElementById('template-name').value.trim();
    const type = document.getElementById('template-type').value;
    const isFree = document.getElementById('is-free').checked;
    const isPremade = document.getElementById('is-premade').checked;

    if (!name) return alert('Please enter a template name.');

    let workoutData;
    if (type === 'full') {
        if (sessions.every(s => !s.warmup.length && !s.exercises.length))
            return alert('Add at least one exercise to a session.');
        workoutData = sessions;
    } else {
        const key = type === 'warmup' ? 'warmup' : 'exercises';
        const list = sessions[0][key];
        if (!list.length) return alert('Add at least one exercise.');
        workoutData = list;
    }

    const data = {
    name, type,
    workout_data: workoutData,
    is_free: isFree,
    is_premade: isPremade,
    is_repeatable: document.getElementById('is-repeatable').checked,
    creator: pb.authStore.model.id
};
    try {
        if (editingId) await pb.collection('templates').update(editingId, data);
        else await pb.collection('templates').create(data);
        showToast(editingId ? '✓ Updated' : '✓ Saved');
        editingId = null;
        document.getElementById('save-btn').textContent = '💾 SAVE TEMPLATE';
        await fetchSavedTemplates();
    } catch(e) { alert(e.message); }
}

async function fetchSavedTemplates() {
    try {
        const recs = await pb.collection('templates').getFullList({ sort: '-created' });

        const row = r => {
            const badges = [];
            if (r.is_free) badges.push(`<span class="saved-badge" style="background:#1a3a1a; color:#4ade80;">FREE</span>`);
            if (r.is_premade) badges.push(`<span class="saved-badge" style="background:#1a2a3a; color:var(--brand-accent);">PREMADE</span>`);
if (r.is_repeatable) badges.push(`<span class="saved-badge" style="background:#1a1a3a; color:#c084fc;">🔁 REPEATABLE</span>`);
            const count = Array.isArray(r.workout_data) ? r.workout_data.length : '?';
            const sub = r.type === 'full' ? `<span style="font-size:0.65rem; color:#555; margin-left:6px;">${count} sessions</span>` : '';
            return `<div class="saved-row">
                <div class="saved-row-name">${r.name}${sub}${badges.join('')}</div>
                <div style="display:flex; gap:12px;">
                    <i class="fas fa-edit" style="color:var(--brand-accent); cursor:pointer;" onclick="loadTemplate('${r.id}')"></i>
                    <i class="fas fa-trash" style="color:#ff5252; cursor:pointer;" onclick="deleteTemplate('${r.id}')"></i>
                </div>
            </div>`;
        };

        const full = recs.filter(r => r.type === 'full');
        const warmups = recs.filter(r => r.type === 'warmup');
        const workouts = recs.filter(r => r.type === 'workout');

        document.getElementById('list-full').innerHTML = full.length ? full.map(row).join('') : '<div style="color:#333; font-size:0.75rem; padding:8px 0;">None saved.</div>';
        document.getElementById('list-warmup').innerHTML = warmups.length ? warmups.map(row).join('') : '<div style="color:#333; font-size:0.75rem; padding:8px 0;">None saved.</div>';
        document.getElementById('list-workout').innerHTML = workouts.length ? workouts.map(row).join('') : '<div style="color:#333; font-size:0.75rem; padding:8px 0;">None saved.</div>';
    } catch(e) { console.error(e); }
}

async function loadTemplate(id) {
    try {
        const rec = await pb.collection('templates').getOne(id);
        editingId = rec.id;

        document.getElementById('template-name').value = rec.name;
        document.getElementById('template-type').value = rec.type;
        document.getElementById('is-free').checked = rec.is_free || false;
        document.getElementById('is-premade').checked = rec.is_premade || false;
        document.getElementById('is-repeatable').checked = rec.is_repeatable || false;

        let data = typeof rec.workout_data === 'string' ? JSON.parse(rec.workout_data) : rec.workout_data;

        if (rec.type === 'full') {
           sessions = Array.isArray(data) ? data.map((s, i) => ({
    sessionNum: s.sessionNum || i + 1,
    warmup: s.warmup || [],
    exercises: s.exercises || [],
    description: s.description || ''
})) : [{ sessionNum: 1, warmup: [], exercises: [] }];
        } else {
            // Section template — load into session 0
            sessions = [{ sessionNum: 1, warmup: [], exercises: [] }];
            const key = rec.type === 'warmup' ? 'warmup' : 'exercises';
            sessions[0][key] = Array.isArray(data) ? data : [];
        }

        currentSession = 0;
        document.getElementById('save-btn').textContent = '🆙 UPDATE TEMPLATE';
        onTypeChange();
        renderTabs();
        renderSections();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast('Template loaded');
    } catch(e) { alert(e.message); }
}

async function deleteTemplate(id) {
    if (!confirm('Delete this template?')) return;
    try { await pb.collection('templates').delete(id); await fetchSavedTemplates(); }
    catch(e) { alert(e.message); }
}

function resetBuilder() {
    if (!confirm('Clear current build?')) return;
    sessions = [{ sessionNum: 1, warmup: [], exercises: [] }];
    currentSession = 0;
    editingId = null;
    document.getElementById('template-name').value = '';
    document.getElementById('is-free').checked = false;
    document.getElementById('is-premade').checked = false;
    document.getElementById('is-repeatable').checked = false;
    document.getElementById('save-btn').textContent = '💾 SAVE TEMPLATE';
    renderTabs();
    renderSections();
}

// ── ADD EXERCISE MODAL ────────────────────────────
function openAddModal() {
    modalTags = [];
    document.getElementById('modal-tags').innerHTML = Object.entries(filterGroups).map(([group, tags]) => `
        <div class="modal-group-title">${group}</div>
        <div style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px;">
            ${tags.map(tag => `<button class="modal-tag-btn" data-tag="${tag}" onclick="toggleModalTag('${tag}',this)">${tag.replace(/-/g,' ')}</button>`).join('')}
        </div>`).join('');
    document.getElementById('new-ex-name').value = '';
    document.getElementById('new-ex-video').value = '';
    document.getElementById('add-modal').classList.add('open');
}

function closeAddModal() { document.getElementById('add-modal').classList.remove('open'); }

function toggleModalTag(tag, btn) {
    modalTags.includes(tag) ? (modalTags = modalTags.filter(t => t !== tag), btn.classList.remove('active'))
                             : (modalTags.push(tag), btn.classList.add('active'));
}

async function saveNewExercise() {
    const name = document.getElementById('new-ex-name').value.trim();
    const video = document.getElementById('new-ex-video').value.trim();
    if (!name) return alert('Please enter a name.');
    const videoTags = video ? [] : ['NO-VIDEO'];
    const allTags = [...modalTags, ...videoTags];
    const fullTitle = allTags.length ? `${allTags.join(' ')} ${name}` : name;
    const searchStr = allTags.join(' ').toLowerCase() + ' ' + name.toLowerCase();
    try {
        const rec = await pb.collection('custom_exercises').create({ title: fullTitle, searchStr, video, uploaded_by: pb.authStore.model.id });
        exerciseDatabase.push({ id: rec.id, title: fullTitle, searchStr });
        closeAddModal();
        renderVault();
        showToast('Exercise added to Vault');
    } catch(e) { alert(e.message); }
}

// ── TOAST ─────────────────────────────────────────
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.style.opacity = '0', 2000);
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Dashboard | RestPeriod</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.3/pocketbase.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap');
        :root {
            --brand-primary: #003B5C;
            --brand-secondary: #2E7D32;
            --brand-accent: #26C6DA;
            --brand-bg: #020c12;
            --text-main: #E0F7FA;
            --card-bg: #0e1b24;
            --input-bg: #002840;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Open Sans', sans-serif; background: var(--brand-bg); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

        .nav-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #000; border-bottom: 1px solid #004d7a; position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-family: 'Montserrat'; font-weight: 800; font-size: 1.1rem; }
        .nav-brand span { color: var(--brand-accent); }
        .nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .nav-user { font-size: 0.75rem; color: #888; }
        .btn-nav { background: none; border: 1px solid #1a2a35; color: #888; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.7rem; font-family: 'Montserrat'; font-weight: 700; transition: 0.2s; }
        .btn-nav:hover { color: var(--brand-accent); border-color: var(--brand-accent); }
        .btn-nav.primary { background: var(--brand-accent); color: #000; border-color: var(--brand-accent); }

        .greeting { padding: 24px 20px 8px; }
        .greeting h1 { font-family: 'Montserrat'; font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
        .greeting p { color: #888; font-size: 0.85rem; }
        .greeting span { color: var(--brand-accent); }

        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        .section-title { font-family: 'Montserrat'; font-size: 0.7rem; font-weight: 800; color: var(--brand-accent); text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 12px; }

        /* PROGRAM CARDS */
        .programs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 8px; }
        .program-card { background: var(--card-bg); border: 1px solid #1a2a35; border-radius: 10px; padding: 16px; cursor: pointer; transition: 0.2s; position: relative; }
        .program-card:hover { border-color: var(--brand-accent); transform: translateY(-2px); }
        .prog-name { font-family: 'Montserrat'; font-weight: 800; font-size: 0.95rem; margin-bottom: 6px; }
        .prog-meta { font-size: 0.72rem; color: #888; margin-bottom: 12px; }
        .prog-bar-bg { background: #050d12; border-radius: 10px; height: 6px; overflow: hidden; margin-bottom: 8px; }
        .prog-bar-fill { height: 100%; background: linear-gradient(90deg, var(--brand-secondary), var(--brand-accent)); border-radius: 10px; transition: width 0.5s; }
        .prog-pct { font-size: 0.65rem; color: #888; display: flex; justify-content: space-between; }
        .prog-pct span { color: var(--brand-accent); font-weight: 800; }
        .prog-last { font-size: 0.65rem; color: #555; margin-top: 8px; }
        .prog-arrow { position: absolute; top: 16px; right: 16px; color: var(--brand-accent); font-size: 0.8rem; opacity: 0.5; }
        .prog-weeks { font-size: 0.65rem; color: #555; margin-top: 4px; }
        .no-programs { color: #555; font-size: 0.85rem; text-align: center; padding: 30px; background: var(--card-bg); border: 1px solid #1a2a35; border-radius: 10px; }

        /* CALENDAR */
        .cal-card { background: var(--card-bg); border: 1px solid #1a2a35; border-radius: 10px; padding: 16px; }
        .cal-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
        .cal-toggle { display: flex; gap: 4px; background: #050d12; padding: 3px; border-radius: 6px; }
        .cal-toggle-btn { padding: 5px 12px; border: none; border-radius: 4px; background: none; color: #555; font-family: 'Montserrat'; font-weight: 700; font-size: 0.65rem; cursor: pointer; transition: 0.2s; }
        .cal-toggle-btn.active { background: var(--brand-accent); color: #000; }
        .cal-nav { display: flex; align-items: center; gap: 8px; }
        .cal-nav button { background: #050d12; border: 1px solid #1a2a35; color: var(--brand-accent); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
        .cal-nav button:hover { background: #0e1b24; }
        .cal-period { font-family: 'Montserrat'; font-weight: 700; font-size: 0.8rem; color: white; }

        /* MONTH GRID */
        .cal-month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-dow { text-align: center; font-size: 0.55rem; color: #555; font-weight: 800; font-family: 'Montserrat'; padding: 4px 0; text-transform: uppercase; }
        .cal-mday { min-height: 60px; background: #050d12; border-radius: 4px; padding: 4px; border: 1px solid transparent; position: relative; }
        .cal-mday.today { border-color: var(--brand-accent) !important; }
        .cal-mday.other-month .cal-mday-num { color: #222; }
        .cal-mday.has-session { background: #0a1f0e; border-color: #1a3a1a; }
        .cal-mday.has-planned { border-color: #2a1a3a; }
        .cal-mday.has-session.has-planned { border-color: #1a3a4a; }
        .cal-mday-num { font-size: 0.65rem; color: #444; margin-bottom: 3px; }
        .cal-mday.today .cal-mday-num { color: var(--brand-accent); font-weight: 800; }
        .cal-session-pill { border-radius: 3px; padding: 2px 4px; font-size: 0.48rem; color: white; font-weight: 800; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; background: var(--brand-secondary); cursor: pointer; }
        .cal-session-pill.planned { background: #4a1a6a; }
        .add-plan-btn { position: absolute; bottom: 3px; right: 3px; background: none; border: none; color: #333; cursor: pointer; font-size: 0.75rem; padding: 0; line-height: 1; transition: 0.2s; }
        .add-plan-btn:hover { color: var(--brand-accent); }

        /* WEEK VIEW */
        .cal-week-list { display: flex; flex-direction: column; gap: 6px; }
        .cal-wday { background: #050d12; border-radius: 6px; padding: 10px 12px; border: 1px solid #1a2a35; }
        .cal-wday.today { border-color: var(--brand-accent); }
        .cal-wday-label { font-size: 0.62rem; color: #555; font-family: 'Montserrat'; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        .cal-wday-session { background: #0e2a1a; border: 1px solid #1a4a2a; border-radius: 4px; padding: 8px 10px; margin-bottom: 4px; }
        .cal-wday-session.planned { background: #1a0e2a; border-color: #3a1a4a; cursor: pointer; }
        .cal-wday-prog { font-size: 0.78rem; font-weight: 700; color: #4ade80; margin-bottom: 2px; }
        .cal-wday-prog.planned { color: #c084fc; }
        .cal-wday-sub { font-size: 0.65rem; color: #555; }
        .cal-wday-empty { color: #333; font-size: 0.65rem; }
        .week-add-btn { background: none; border: 1px solid #1a2a35; color: var(--brand-accent); border-radius: 4px; padding: 2px 8px; font-size: 0.6rem; cursor: pointer; font-family: 'Montserrat'; font-weight: 800; }

        /* CHECKINS */
        .checkin-card { background: var(--card-bg); border: 1px solid #1a2a35; border-radius: 10px; padding: 16px; margin-bottom: 10px; }
        .checkin-date { font-family: 'Montserrat'; font-weight: 800; font-size: 0.8rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .checkin-avg { background: var(--brand-secondary); border-radius: 20px; padding: 3px 10px; font-size: 0.7rem; font-weight: 800; }
        .checkin-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 10px; }
        .checkin-stat { background: #050d12; border-radius: 6px; padding: 8px; text-align: center; border: 1px solid #1a2a35; }
        .checkin-stat-icon { font-size: 0.9rem; }
        .checkin-stat-val { font-size: 1rem; font-weight: 800; color: var(--brand-accent); }
        .checkin-stat-label { font-size: 0.55rem; color: #555; }
        .checkin-text { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
        .checkin-text strong { font-weight: 800; }

        /* PLAN MODAL */
        .plan-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 6000; align-items: center; justify-content: center; padding: 20px; }
        .plan-modal-overlay.open { display: flex; }
        .plan-modal { background: var(--card-bg); border: 1px solid var(--brand-accent); border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .plan-modal h3 { font-family: 'Montserrat'; font-size: 0.85rem; color: var(--brand-accent); margin: 0 0 16px; }
        .plan-field { margin-bottom: 12px; }
        .plan-label { font-size: 0.6rem; font-weight: 800; color: #888; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 5px; }
        .plan-input { width: 100%; background: #050d12; border: 1px solid #1a2a35; color: white; padding: 10px; border-radius: 6px; font-family: inherit; font-size: 0.9rem; }
        .plan-input:focus { outline: none; border-color: var(--brand-accent); }
        .plan-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
        .plan-btn { padding: 10px; border: none; border-radius: 6px; font-family: 'Montserrat'; font-weight: 800; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }
        .plan-btn-save { background: var(--brand-secondary); color: white; }
        .plan-btn-cancel { background: #1a2a35; color: #888; }
        .plan-btn-delete { background: rgba(255,82,82,0.1); color: #ff5252; border: 1px solid #ff5252; grid-column: 1/-1; }
    </style>
</head>
<body>

<div class="nav-top">
    <div class="nav-brand">REST <span>PERIOD</span></div>
    <div class="nav-right">
        <span class="nav-user" id="nav-user"></span>
        <button class="btn-nav primary" onclick="window.location.href='program.html'">▶ Train</button>
        <button class="btn-nav" onclick="window.location.href='checkin.html'">📝 Check-In</button>
        <button class="btn-nav" onclick="logout()">Logout</button>
    </div>
</div>

<div class="greeting container">
    <h1>Hey, <span id="greeting-name"></span> 👋</h1>
    <p id="greeting-sub">Here's your training overview.</p>
</div>

<div class="container">

    <div class="programs-grid" id="programs-grid">
        <div class="no-programs">Loading programs...</div>
    </div>

    <div class="section-title">📅 Training Calendar</div>
    <div class="cal-card">
        <div class="cal-controls">
            <div class="cal-toggle">
                <button class="cal-toggle-btn active" id="cal-month-btn" onclick="setCalView('month')">Month</button>
                <button class="cal-toggle-btn" id="cal-week-btn" onclick="setCalView('week')">Week</button>
            </div>
            <div class="cal-nav">
                <button onclick="moveCal(-1)">←</button>
                <span class="cal-period" id="cal-period"></span>
                <button onclick="moveCal(1)">→</button>
            </div>
        </div>
        <div id="cal-content"></div>
    </div>

    <div class="section-title">📝 Recent Check-ins</div>
    <div id="checkins-list"></div>

</div>

<!-- PLAN MODAL -->
<div class="plan-modal-overlay" id="plan-modal" onclick="if(event.target===this)closePlanModal()">
    <div class="plan-modal">
        <h3 id="plan-modal-title">📅 Add Planned Workout</h3>
        <input type="hidden" id="plan-id">
        <div class="plan-field">
            <span class="plan-label">Title</span>
            <input type="text" class="plan-input" id="plan-title" placeholder="e.g. Morning Run" />
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div class="plan-field">
                <span class="plan-label">Date</span>
                <input type="date" class="plan-input" id="plan-date" />
            </div>
            <div class="plan-field">
                <span class="plan-label">Time</span>
                <input type="time" class="plan-input" id="plan-time" />
            </div>
        </div>
        <div class="plan-field">
            <span class="plan-label">Type</span>
            <select class="plan-input" id="plan-type">
                <option value="strength">💪 Strength</option>
                <option value="cardio">🏃 Cardio</option>
                <option value="recovery">🧘 Recovery</option>
                <option value="mobility">🤸 Mobility</option>
                <option value="other">⚡ Other</option>
            </select>
        </div>
        <div class="plan-field">
            <span class="plan-label">Notes</span>
            <textarea class="plan-input" id="plan-notes" rows="3" placeholder="Any details..."></textarea>
        </div>
        <div class="plan-field">
            <span class="plan-label">Repeat</span>
            <select class="plan-input" id="plan-repeat" onchange="toggleRepeatOptions()">
                <option value="none">One-off</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="custom">Custom days</option>
            </select>
        </div>
        <div id="repeat-days-field" class="plan-field" style="display:none;">
            <span class="plan-label">Repeat on days</span>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
                <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Mon" style="width:auto;margin:0;"> Mon</label>
                <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Tue" style="width:auto;margin:0;"> Tue</label>
                <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Wed" style="width:auto;margin:0;"> Wed</label>
                <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Thu" style="width:auto;margin:0;"> Thu</label>
                <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Fri" style="width:auto;margin:0;"> Fri</label>
                <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Sat" style="width:auto;margin:0;"> Sat</label>
                <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Sun" style="width:auto;margin:0;"> Sun</label>
            </div>
        </div>
        <div id="repeat-until-field" class="plan-field" style="display:none;">
            <span class="plan-label">Repeat until</span>
            <input type="date" class="plan-input" id="plan-repeat-until" />
        </div>
        <div class="plan-actions">
            <button class="plan-btn plan-btn-save" onclick="savePlan()">Save</button>
            <button class="plan-btn plan-btn-cancel" onclick="closePlanModal()">Cancel</button>
            <button class="plan-btn plan-btn-delete" id="plan-delete-btn" style="display:none;" onclick="deletePlan()">Delete this workout</button>
        </div>
    </div>
</div>

<script>
const pb = new PocketBase('https://restperiod.org');

let allPrograms = [];
let sessionMap = {};
let plannedWorkouts = [];
let calView = 'month';
let calDate = new Date();

const typeColors = {
    strength: '#26C6DA', cardio: '#f87171', recovery: '#c084fc',
    mobility: '#4ade80', other: '#fb923c'
};
const typeEmoji = {
    strength: '💪', cardio: '🏃', recovery: '🧘', mobility: '🤸', other: '⚡'
};

window.onload = async () => {
    if (!pb.authStore.isValid) { window.location.href = 'index.html'; return; }
    const role = pb.authStore.model.role;
    if (role === 'trainer' || role === 'admin') { window.location.href = 'dashboard.html'; return; }
    if (role === 'free') { window.location.href = 'free.html'; return; }

    const name = pb.authStore.model.name || pb.authStore.model.email;
    document.getElementById('nav-user').textContent = name;
    document.getElementById('greeting-name').textContent = name.split(' ')[0];

    await Promise.all([loadPrograms(), loadPlannedWorkouts()]);
    buildSessionMap();
    renderCalendar();
    loadCheckins();
};

function logout() { pb.authStore.clear(); window.location.href = 'index.html'; }

// ── PROGRAMS ──────────────────────────────────────
async function loadPrograms() {
    try {
        const [clientRecs, templateRecs, freeRecs] = await Promise.all([
            pb.collection('programs').getFullList({ filter: `client = "${pb.authStore.model.id}" && archived = false`, sort: '-created', requestKey: null }),
            pb.collection('programs').getFullList({ filter: 'is_template = true && is_free = false', sort: 'name', requestKey: null }),
            pb.collection('programs').getFullList({ filter: 'is_free = true', sort: 'name', requestKey: null })
        ]);
        allPrograms = [...clientRecs, ...templateRecs, ...freeRecs];
        renderPrograms(clientRecs, templateRecs, freeRecs);
    } catch(e) {
        console.error(e);
        document.getElementById('programs-grid').innerHTML = '<div class="no-programs">Could not load programs.</div>';
    }
}

function progCard(prog) {
    let data = prog.workout_data;
    if (typeof data === 'string') data = JSON.parse(data);
    const schedule = data.schedule || data;
    let totalSets = 0, doneSets = 0, lastSession = null, completedWeeks = 0;
    schedule.forEach(week => {
        [...(week.warmup||[]), ...(week.exercises||[])].forEach(ex => {
            (ex.setsData||[]).forEach(s => { totalSets++; if (s.act_reps && s.act_weight) doneSets++; });
        });
        if (week.sessionDate) { completedWeeks++; if (!lastSession || week.sessionDate > lastSession) lastSession = week.sessionDate; }
    });
    const pct = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;
    const lastStr = lastSession ? new Date(lastSession).toLocaleDateString([], { day: 'numeric', month: 'short' }) : 'Not started';
    return `<div class="program-card" onclick="goToProgram('${prog.id}')">
        <i class="fas fa-chevron-right prog-arrow"></i>
        <div class="prog-name">${prog.name}</div>
        <div class="prog-meta">${prog.description || ''}</div>
        <div class="prog-bar-bg"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
        <div class="prog-pct"><span>${pct}% complete</span><span style="color:#555">${doneSets}/${totalSets} sets</span></div>
        <div class="prog-weeks">${completedWeeks} of ${schedule.length} weeks logged</div>
        <div class="prog-last">Last session: ${lastStr}</div>
    </div>`;
}

function renderPrograms(clientProgs, templateProgs, freeProgs) {
    const grid = document.getElementById('programs-grid');
    let html = '';
    if (clientProgs.length > 0) {
        html += `<div class="section-title" style="grid-column:1/-1;">📋 Your Programs</div>`;
        html += clientProgs.map(progCard).join('');
    } else {
        html += `<div class="no-programs" style="grid-column:1/-1;">No custom programs yet — your coach will assign one soon.</div>`;
    }
    if (templateProgs.length > 0) {
        html += `<div class="section-title" style="grid-column:1/-1; margin-top:20px;">📚 Coach Programs</div>`;
        html += templateProgs.map(progCard).join('');
    }
    if (freeProgs.length > 0) {
        html += `<div class="section-title" style="grid-column:1/-1; margin-top:20px;">🆓 Free Programs</div>`;
        html += freeProgs.map(progCard).join('');
    }
    grid.innerHTML = html;
    document.getElementById('greeting-sub').textContent = `${allPrograms.length} program${allPrograms.length !== 1 ? 's' : ''} · Keep it up!`;
}

function goToProgram(id) { window.location.href = `program.html?id=${id}`; }

// ── SESSION MAP ───────────────────────────────────
function buildSessionMap() {
    sessionMap = {};
    allPrograms.forEach(prog => {
        let data = prog.workout_data;
        if (typeof data === 'string') data = JSON.parse(data);
        const schedule = data.schedule || data;
        schedule.forEach(week => {
            if (!week.sessionDate) return;
            const dateStr = week.sessionDate.substring(0, 10);
            let total = 0, done = 0;
            [...(week.warmup||[]), ...(week.exercises||[])].forEach(ex => {
                (ex.setsData||[]).forEach(s => { total++; if (s.act_reps && s.act_weight) done++; });
            });
            const pct = total > 0 ? Math.round((done/total)*100) : 0;
            if (!sessionMap[dateStr]) sessionMap[dateStr] = [];
            sessionMap[dateStr].push({ programName: prog.name, weekNum: week.weekNum, pct });
        });
    });
}

// ── PLANNED WORKOUTS ──────────────────────────────
async function loadPlannedWorkouts() {
    try {
        plannedWorkouts = await pb.collection('planned_workouts').getFullList({
            filter: `user = "${pb.authStore.model.id}"`,
            sort: 'date',
            requestKey: null
        });
    } catch(e) { console.error(e); }
}

function getPlannedForDate(dateStr) {
    const results = [];
    plannedWorkouts.forEach(pw => {
        const pwDate = pw.date?.substring(0,10);
        if (!pwDate) return;
        if (pw.repeat === 'none' && pwDate === dateStr) {
            results.push(pw);
        } else if (pw.repeat === 'daily') {
            const until = pw.repeat_until ? pw.repeat_until.substring(0,10) : '2099-12-31';
            if (dateStr >= pwDate && dateStr <= until) results.push(pw);
        } else if (pw.repeat === 'weekly') {
            const until = pw.repeat_until ? pw.repeat_until.substring(0,10) : '2099-12-31';
            if (dateStr >= pwDate && dateStr <= until) {
                if (new Date(pwDate).getDay() === new Date(dateStr).getDay()) results.push(pw);
            }
        } else if (pw.repeat === 'custom') {
            const until = pw.repeat_until ? pw.repeat_until.substring(0,10) : '2099-12-31';
            if (dateStr >= pwDate && dateStr <= until) {
                const days = (pw.repeat_days || '').split(',');
                const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                if (days.includes(dayNames[new Date(dateStr).getDay()])) results.push(pw);
            }
        }
    });
    return results;
}

function openPlanModal(dateStr, existingId) {
    document.getElementById('plan-id').value = existingId || '';
    document.getElementById('plan-date').value = dateStr || new Date().toISOString().split('T')[0];
    document.getElementById('plan-modal-title').textContent = existingId ? '✏️ Edit Planned Workout' : '📅 Add Planned Workout';
    document.getElementById('plan-delete-btn').style.display = existingId ? 'block' : 'none';
    if (existingId) {
        const pw = plannedWorkouts.find(p => p.id === existingId);
        if (pw) {
            document.getElementById('plan-title').value = pw.title || '';
            document.getElementById('plan-time').value = pw.time || '';
            document.getElementById('plan-type').value = pw.type || 'other';
            document.getElementById('plan-notes').value = pw.notes || '';
            document.getElementById('plan-repeat').value = pw.repeat || 'none';
            document.getElementById('plan-repeat-until').value = pw.repeat_until?.substring(0,10) || '';
            if (pw.repeat === 'custom') {
                const days = (pw.repeat_days || '').split(',');
                document.querySelectorAll('.repeat-day-cb').forEach(cb => { cb.checked = days.includes(cb.value); });
            }
        }
    } else {
        document.getElementById('plan-title').value = '';
        document.getElementById('plan-time').value = '';
        document.getElementById('plan-type').value = 'strength';
        document.getElementById('plan-notes').value = '';
        document.getElementById('plan-repeat').value = 'none';
        document.getElementById('plan-repeat-until').value = '';
        document.querySelectorAll('.repeat-day-cb').forEach(cb => cb.checked = false);
    }
    toggleRepeatOptions();
    document.getElementById('plan-modal').classList.add('open');
}

function closePlanModal() { document.getElementById('plan-modal').classList.remove('open'); }

function toggleRepeatOptions() {
    const val = document.getElementById('plan-repeat').value;
    document.getElementById('repeat-days-field').style.display = val === 'custom' ? 'block' : 'none';
    document.getElementById('repeat-until-field').style.display = val !== 'none' ? 'block' : 'none';
}

async function savePlan() {
    const title = document.getElementById('plan-title').value.trim();
    if (!title) return alert('Please enter a title');
    const repeatVal = document.getElementById('plan-repeat').value;
    const customDays = repeatVal === 'custom'
        ? Array.from(document.querySelectorAll('.repeat-day-cb:checked')).map(cb => cb.value).join(',')
        : '';
    const payload = {
        user: pb.authStore.model.id,
        title,
        date: document.getElementById('plan-date').value,
        time: document.getElementById('plan-time').value,
        type: document.getElementById('plan-type').value,
        notes: document.getElementById('plan-notes').value,
        repeat: repeatVal,
        repeat_days: customDays,
        repeat_until: document.getElementById('plan-repeat-until').value || null
    };
    try {
        const id = document.getElementById('plan-id').value;
        if (id) await pb.collection('planned_workouts').update(id, payload);
        else await pb.collection('planned_workouts').create(payload);
        closePlanModal();
        await loadPlannedWorkouts();
        renderCalendar();
    } catch(e) { alert('Save failed: ' + e.message); }
}

async function deletePlan() {
    const id = document.getElementById('plan-id').value;
    if (!id || !confirm('Delete this planned workout?')) return;
    try {
        await pb.collection('planned_workouts').delete(id);
        closePlanModal();
        await loadPlannedWorkouts();
        renderCalendar();
    } catch(e) { alert('Delete failed: ' + e.message); }
}

// ── CALENDAR ──────────────────────────────────────
function setCalView(view) {
    calView = view;
    document.getElementById('cal-month-btn').classList.toggle('active', view === 'month');
    document.getElementById('cal-week-btn').classList.toggle('active', view === 'week');
    renderCalendar();
}

function moveCal(dir) {
    if (calView === 'month') calDate.setMonth(calDate.getMonth() + dir);
    else calDate.setDate(calDate.getDate() + dir * 7);
    renderCalendar();
}

function renderCalendar() {
    if (calView === 'month') renderMonthView();
    else renderWeekView();
}

function renderMonthView() {
    const year = calDate.getFullYear();
    const month = calDate.getMonth();
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('cal-period').textContent = calDate.toLocaleDateString([], { month: 'long', year: 'numeric' });
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDow = (firstDay.getDay() + 6) % 7;

    let html = `<div class="cal-month-grid">`;
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => { html += `<div class="cal-dow">${d}</div>`; });
    for (let i = 0; i < startDow; i++) { html += `<div class="cal-mday other-month"><div class="cal-mday-num"></div></div>`; }

    for (let d = 1; d <= lastDay.getDate(); d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const sessions = sessionMap[dateStr] || [];
        const planned = getPlannedForDate(dateStr);
        const isToday = dateStr === today;
        const classes = [
            'cal-mday',
            sessions.length ? 'has-session' : '',
            planned.length ? 'has-planned' : '',
            isToday ? 'today' : ''
        ].filter(Boolean).join(' ');

        html += `<div class="${classes}">
            <div class="cal-mday-num">${d}</div>
            ${sessions.map(s => `<div class="cal-session-pill" title="${s.programName} · Wk${s.weekNum} · ${s.pct}%">${s.programName} · Wk${s.weekNum}</div>`).join('')}
            ${planned.map(pw => `<div class="cal-session-pill planned" style="background:${typeColors[pw.type]||'#888'}33;color:${typeColors[pw.type]||'#888'};" onclick="openPlanModal('${dateStr}','${pw.id}');event.stopPropagation();">${typeEmoji[pw.type]||'⚡'} ${pw.title}</div>`).join('')}
            <button class="add-plan-btn" onclick="openPlanModal('${dateStr}')" title="Add planned workout">＋</button>
        </div>`;
    }
    html += `</div>`;
    document.getElementById('cal-content').innerHTML = html;
}

function renderWeekView() {
    const today = new Date().toISOString().split('T')[0];
    const dow = (calDate.getDay() + 6) % 7;
    const monday = new Date(calDate);
    monday.setDate(calDate.getDate() - dow);
    const days = [];
    for (let i = 0; i < 7; i++) { const d = new Date(monday); d.setDate(monday.getDate() + i); days.push(d); }
    const startStr = days[0].toLocaleDateString([], { month: 'short', day: 'numeric' });
    const endStr = days[6].toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById('cal-period').textContent = `${startStr} – ${endStr}`;
    const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

    let html = `<div class="cal-week-list">`;
    days.forEach((day, i) => {
        const dateStr = day.toISOString().split('T')[0];
        const sessions = sessionMap[dateStr] || [];
        const planned = getPlannedForDate(dateStr);
        const isToday = dateStr === today;

        html += `<div class="cal-wday ${isToday ? 'today' : ''}">
            <div class="cal-wday-label">
                <span>${dayNames[i]} ${day.getDate()} ${day.toLocaleDateString([],{month:'short'})}</span>
                <button class="week-add-btn" onclick="openPlanModal('${dateStr}')">+ Plan</button>
            </div>
            ${sessions.length === 0 && planned.length === 0 ? `<div class="cal-wday-empty">—</div>` : ''}
            ${sessions.map(s => `
                <div class="cal-wday-session">
                    <div class="cal-wday-prog">${s.programName}</div>
                    <div class="cal-wday-sub">Week ${s.weekNum} · ${s.pct}% complete</div>
                </div>`).join('')}
            ${planned.map(pw => `
                <div class="cal-wday-session planned" onclick="openPlanModal('${dateStr}','${pw.id}')">
                    <div class="cal-wday-prog planned" style="color:${typeColors[pw.type]||'#888'}">${typeEmoji[pw.type]||'⚡'} ${pw.title}${pw.time?' · '+pw.time:''}</div>
                    <div class="cal-wday-sub">${pw.type}${pw.repeat!=='none'?' · repeating':''}</div>
                </div>`).join('')}
        </div>`;
    });
    html += `</div>`;
    document.getElementById('cal-content').innerHTML = html;
}

// ── CHECKINS ──────────────────────────────────────
async function loadCheckins() {
    try {
        const recs = await pb.collection('checkins').getList(1, 4, {
            filter: `client = "${pb.authStore.model.id}"`,
            sort: '-created'
        });
        const el = document.getElementById('checkins-list');
        if (recs.items.length === 0) {
            el.innerHTML = `<div class="no-programs">No check-ins yet — <a href="checkin.html" style="color:var(--brand-accent)">submit your first one</a>.</div>`;
            return;
        }
        el.innerHTML = recs.items.map(c => {
            const date = new Date(c.created).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
            const avg = Math.round((c.energy + c.sleep + c.mindset + c.training + c.nutrition + c.incidental) / 6);
            return `<div class="checkin-card">
                <div class="checkin-date">
                    <span>${date}</span>
                    <span class="checkin-avg">avg ${avg}/10</span>
                </div>
                <div class="checkin-grid">
                    <div class="checkin-stat"><div class="checkin-stat-icon">⚡</div><div class="checkin-stat-val">${c.energy}</div><div class="checkin-stat-label">Energy</div></div>
                    <div class="checkin-stat"><div class="checkin-stat-icon">😴</div><div class="checkin-stat-val">${c.sleep}</div><div class="checkin-stat-label">Sleep</div></div>
                    <div class="checkin-stat"><div class="checkin-stat-icon">🧠</div><div class="checkin-stat-val">${c.mindset}</div><div class="checkin-stat-label">Mindset</div></div>
                    <div class="checkin-stat"><div class="checkin-stat-icon">🏋️</div><div class="checkin-stat-val">${c.training}</div><div class="checkin-stat-label">Training</div></div>
                    <div class="checkin-stat"><div class="checkin-stat-icon">🥗</div><div class="checkin-stat-val">${c.nutrition}</div><div class="checkin-stat-label">Nutrition</div></div>
                    <div class="checkin-stat"><div class="checkin-stat-icon">🚶</div><div class="checkin-stat-val">${c.incidental}</div><div class="checkin-stat-label">Activity</div></div>
                </div>
                ${c.WIN ? `<div class="checkin-text"><strong style="color:#4ade80;">WIN</strong> ${c.WIN}</div>` : ''}
                ${c.WORK_ON ? `<div class="checkin-text"><strong style="color:#fb923c;">WORK ON</strong> ${c.WORK_ON}</div>` : ''}
            </div>`;
        }).join('');
    } catch(e) { console.error(e); }
}

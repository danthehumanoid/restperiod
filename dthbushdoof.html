<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTH — Jungle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #ffde59;
            --red: #ce0104;
            --dark: #0e0e0e;
            --surface: #181818;
            --surface2: #222222;
            --border: #2a2a2a;
            --text: #e0e0e0;
            --muted: #777;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--dark);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
                repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
        }

        a { color: var(--yellow); text-decoration: none; }

        /* HEADER */
        .page-header {
            text-align: center;
            margin-bottom: 48px;
        }
        .site-title {
            font-family: 'Space Mono', monospace;
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: var(--red);
            letter-spacing: 4px;
            line-height: 1;
        }
        .track-title {
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            color: var(--yellow);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 10px;
            opacity: 0.85;
        }

        /* CONTAINER */
        .players-wrap {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* CARD */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }
        .card-label {
            padding: 9px 18px;
            background: var(--surface2);
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--yellow);
            border-bottom: 1px solid var(--border);
        }

        /* VIDEO PLAYER */
        .video-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            cursor: pointer;
        }
        .video-wrap video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .vid-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .video-wrap:hover .vid-overlay { opacity: 1; }
        .big-play {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: rgba(255, 222, 89, 0.15);
            border: 2px solid var(--yellow);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s, background 0.15s;
        }
        .big-play:hover { transform: scale(1.1); background: rgba(255,222,89,0.25); }
        .big-play svg { width: 22px; height: 22px; fill: var(--yellow); margin-left: 3px; }
        .big-play.hidden { display: none; }

        .vid-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 10px 14px 12px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            display: flex;
            flex-direction: column;
            gap: 8px;
            transform: translateY(4px);
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }
        .video-wrap:hover .vid-bar { opacity: 1; transform: translateY(0); }

        .progress-row { display: flex; align-items: center; gap: 10px; }
        .seek-bar {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .seek-fill {
            height: 100%;
            background: var(--yellow);
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
        }
        .seek-bar:hover .seek-fill { height: 5px; margin-top: -1px; }
        .v-time {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.65);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            min-width: 88px;
            text-align: right;
        }

        .btn-row { display: flex; align-items: center; gap: 8px; }
        .ctrl-btn {
            background: none; border: none; cursor: pointer;
            padding: 4px; color: rgba(255,255,255,0.8);
            display: flex; align-items: center; justify-content: center;
            transition: color 0.15s;
        }
        .ctrl-btn:hover { color: var(--yellow); }
        .ctrl-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .vol-grp { display: flex; align-items: center; gap: 6px; margin-left: auto; }
        .vol-grp input[type=range] {
            width: 70px;
            accent-color: var(--yellow);
            cursor: pointer;
            height: 3px;
        }

        /* AUDIO PLAYER */
        .audio-inner { padding: 18px 20px; }
        .aud-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
        .aud-badge {
            width: 48px; height: 48px;
            border-radius: 10px;
            background: var(--red);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            font-weight: 700;
            color: var(--yellow);
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        .aud-meta { flex: 1; min-width: 0; }
        .aud-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .aud-artist {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
            font-family: 'Space Mono', monospace;
            letter-spacing: 1px;
        }

        .aud-controls { display: flex; align-items: center; gap: 12px; }
        .play-btn-big {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--yellow);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: transform 0.15s, background 0.15s;
        }
        .play-btn-big:hover { transform: scale(1.07); background: #ffe97a; }
        .play-btn-big svg { width: 15px; height: 15px; fill: #000; margin-left: 2px; }
        .play-btn-big.pause svg { margin-left: 0; }

        .aud-seek-wrap { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .aud-seek {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .aud-seek:hover { height: 6px; }
        .aud-seek-fill {
            height: 100%;
            background: var(--yellow);
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
        }
        .aud-times {
            display: flex;
            justify-content: space-between;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .aud-vol-row {
            display: flex; align-items: center; gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        .aud-vol-row svg { width: 14px; height: 14px; fill: var(--muted); flex-shrink: 0; }
        .aud-vol-row input[type=range] {
            flex: 1;
            accent-color: var(--yellow);
            cursor: pointer;
        }
        .vol-label {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        /* FOOTER */
        .page-footer {
            margin-top: 48px;
            text-align: center;
        }
        .footer-nav {
            display: flex; gap: 28px; justify-content: center; flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .footer-nav a {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            transition: color 0.2s;
        }
        .footer-nav a:hover { color: var(--yellow); }
        .footer-copy {
            font-size: 11px;
            color: #444;
            font-family: 'Space Mono', monospace;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .vol-grp { display: none; }
        }
    </style>
</head>
<body>

    <header class="page-header">
        <div class="site-title">DEE TEE HAYCH</div>
        <div class="track-title">Jungle</div>
    </header>

    <div class="players-wrap">

        <!-- VIDEO PLAYER -->
        <div class="card">
            <div class="card-label">Video</div>
            <div class="video-wrap" id="vwrap">
                <video id="vid" preload="metadata">
                    <source src="videos/dthjungle.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>

                <div class="vid-overlay" id="voverlay">
                    <div class="big-play" id="bigplay" onclick="toggleVid()">
                        <svg id="bigico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                </div>

                <div class="vid-bar">
                    <div class="progress-row">
                        <div class="seek-bar" id="vseek" onclick="seekVid(event)">
                            <div class="seek-fill" id="vfill"></div>
                        </div>
                        <span class="v-time" id="vtime">0:00 / 0:00</span>
                    </div>
                    <div class="btn-row">
                        <button class="ctrl-btn" onclick="toggleVid()" title="Play / Pause">
                            <svg id="vplayico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <div class="vol-grp">
                            <button class="ctrl-btn" onclick="toggleMuteVid()" title="Mute">
                                <svg id="vvolico" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                            </button>
                            <input type="range" min="0" max="1" step="0.05" value="1" oninput="vid.volume=this.value" title="Volume">
                        </div>
                        <button class="ctrl-btn" onclick="toggleFS()" title="Fullscreen" style="margin-left:auto;">
                            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- AUDIO PLAYER -->
        <div class="card">
            <div class="card-label">Audio</div>
            <div class="audio-inner">
                <div class="aud-top">
                    <div class="aud-badge">DTH</div>
                    <div class="aud-meta">
                        <div class="aud-name">dthjungle.wav</div>
                        <div class="aud-artist">DEE TEE HAYCH</div>
                    </div>
                </div>
                <div class="aud-controls">
                    <button class="play-btn-big" id="apb" onclick="toggleAud()" title="Play / Pause">
                        <svg id="aico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <div class="aud-seek-wrap">
                        <div class="aud-seek" id="aseek" onclick="seekAud(event)">
                            <div class="aud-seek-fill" id="afill"></div>
                        </div>
                        <div class="aud-times">
                            <span id="acur">0:00</span>
                            <span id="adur">—</span>
                        </div>
                    </div>
                </div>
                <div class="aud-vol-row">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM19 12c0-2.94-1.66-5.49-4.12-6.76l-.88 1.73C15.8 7.93 17 9.85 17 12s-1.2 4.07-3 5.03l.88 1.73C17.34 17.49 19 14.94 19 12z"/></svg>
                    <input type="range" min="0" max="1" step="0.05" value="1" oninput="aud.volume=this.value" title="Volume">
                    <span class="vol-label">VOL</span>
                </div>
            </div>
        </div>

    </div>

    <footer class="page-footer">
        <nav class="footer-nav">
            <a href="index.html">Home</a>
            <a href="epk.html">EPK</a>
            <a href="https://open.spotify.com/artist/5PxxCIlhbneezdsaP7FvzV" target="_blank">Spotify</a>
            <a href="https://soundcloud.com/user-269168570" target="_blank">Soundcloud</a>
            <a href="https://www.instagram.com/dan.thehuman/" target="_blank">Instagram</a>
        </nav>
        <p class="footer-copy">© 2025 DEE TEE HAYCH. All Rights Reserved.</p>
    </footer>

<script>
    // ── VIDEO ──────────────────────────────────────────────
    const vid = document.getElementById('vid');

    function fmt(s) {
        s = Math.floor(s || 0);
        return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    function toggleVid() {
        vid.paused ? vid.play() : vid.pause();
    }

    vid.addEventListener('play', () => {
        document.getElementById('vplayico').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        document.getElementById('bigico').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    });
    vid.addEventListener('pause', () => {
        document.getElementById('vplayico').innerHTML = '<path d="M8 5v14l11-7z"/>';
        document.getElementById('bigico').innerHTML = '<path d="M8 5v14l11-7z"/>';
    });
    vid.addEventListener('timeupdate', () => {
        const pct = vid.duration ? (vid.currentTime / vid.duration * 100) : 0;
        document.getElementById('vfill').style.width = pct + '%';
        document.getElementById('vtime').textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
    });

    function seekVid(e) {
        const r = document.getElementById('vseek').getBoundingClientRect();
        if (vid.duration) vid.currentTime = ((e.clientX - r.left) / r.width) * vid.duration;
    }

    function toggleMuteVid() {
        vid.muted = !vid.muted;
        document.getElementById('vvolico').innerHTML = vid.muted
            ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
            : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
    }

    function toggleFS() {
        const vw = document.getElementById('vwrap');
        if (!document.fullscreenElement) { vw.requestFullscreen && vw.requestFullscreen(); }
        else { document.exitFullscreen && document.exitFullscreen(); }
    }

    // ── AUDIO ──────────────────────────────────────────────
    const aud = new Audio('dthjungle.wav');

    function toggleAud() {
        aud.paused ? aud.play() : aud.pause();
    }

    aud.addEventListener('play', () => {
        document.getElementById('aico').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        document.getElementById('apb').classList.add('pause');
    });
    aud.addEventListener('pause', () => {
        document.getElementById('aico').innerHTML = '<path d="M8 5v14l11-7z"/>';
        document.getElementById('apb').classList.remove('pause');
    });
    aud.addEventListener('loadedmetadata', () => {
        document.getElementById('adur').textContent = fmt(aud.duration);
    });
    aud.addEventListener('timeupdate', () => {
        const pct = aud.duration ? (aud.currentTime / aud.duration * 100) : 0;
        document.getElementById('afill').style.width = pct + '%';
        document.getElementById('acur').textContent = fmt(aud.currentTime);
        document.getElementById('adur').textContent = fmt(aud.duration);
    });

    function seekAud(e) {
        const r = document.getElementById('aseek').getBoundingClientRect();
        if (aud.duration) aud.currentTime = ((e.clientX - r.left) / r.width) * aud.duration;
    }
</script>
</body>
</html>

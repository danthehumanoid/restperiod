<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Dashboard | RestPeriod</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.3/pocketbase.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap');
        
        :root { 
            --brand-bg: #020c12; --card-bg: #0e1b24; --brand-accent: #26C6DA;
            --brand-secondary: #2E7D32; --text-main: #E0F7FA; --brand-danger: #ff5252;
        }

        body { margin: 0; font-family: 'Open Sans', sans-serif; background: var(--brand-bg); color: var(--text-main); height: 100vh; overflow: hidden; }

        .nav-top { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: #000; border-bottom: 1px solid #004d7a; }
        .nav-links a { color: #888; text-decoration: none; margin-left: 20px; font-family: 'Montserrat'; font-weight: 700; font-size: 0.8rem; }
        .nav-links a.active { color: white; border-bottom: 2px solid var(--brand-accent); }

        .dashboard-grid { display: grid; grid-template-columns: 300px 1fr 380px; gap: 0; height: calc(100vh - 65px); }
        .col { border-right: 1px solid #1a2a35; padding: 20px; overflow-y: auto; height: 100%; }
        .col:last-child { border-right: none; }

        .card { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid #1a2a35; margin-bottom: 15px; }
        h3 { font-family: 'Montserrat'; font-size: 0.75rem; color: var(--brand-accent); margin-top: 0; letter-spacing: 1px; text-transform: uppercase; }

        .client-item { padding: 12px; border-radius: 6px; cursor: pointer; border-bottom: 1px solid #1a2a35; transition: 0.2s; }
        .client-item:hover { background: #152733; }
        .client-item.active { background: var(--brand-accent); color: black; font-weight: 800; }

        input, textarea { width: 100%; background: #050d12; border: 1px solid #1a2a35; color: white; padding: 10px; border-radius: 4px; font-family: inherit; margin-bottom: 10px; }
        .medical-box { border-left: 4px solid var(--brand-danger); background: rgba(255, 82, 82, 0.05); }

        .btn { border: none; padding: 10px; border-radius: 4px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-family: 'Montserrat'; font-size: 0.7rem; width: 100%; }
        .btn-green { background: var(--brand-secondary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--brand-accent); color: var(--brand-accent); }

        /* Right column tabs */
        .right-tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #050d12; padding: 4px; border-radius: 8px; }
        .right-tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; border-radius: 6px; font-family: 'Montserrat'; font-weight: 700; font-size: 0.7rem; color: #555; border: none; background: none; transition: 0.2s; }
        .right-tab.active { background: var(--brand-accent); color: #000; }

        /* Notes */
        .note-entry { padding: 10px; border-bottom: 1px solid #1a2a35; font-size: 0.8rem; position: relative; }
        .note-date { font-size: 0.65rem; color: var(--brand-accent); margin-bottom: 4px; }
        .note-delete { position: absolute; top: 10px; right: 0; background: none; border: none; color: #333; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
        .note-delete:hover { color: var(--brand-danger); }

        .prog-row { display: flex; justify-content: space-between; align-items: center; background: #050d12; padding: 10px; margin-bottom: 5px; border-radius: 4px; font-size: 0.85rem; }

        /* Calendar */
        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .cal-nav button { background: #050d12; border: 1px solid #1a2a35; color: var(--brand-accent); padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: 'Montserrat'; font-weight: 700; font-size: 0.65rem; }
        .cal-nav button:hover { background: #0e1b24; }
        .cal-period { font-family: 'Montserrat'; font-weight: 700; font-size: 0.8rem; color: white; }

        .cal-view-toggle { display: flex; gap: 4px; margin-bottom: 12px; }
        .cal-view-btn { flex: 1; padding: 6px; text-align: center; cursor: pointer; border-radius: 4px; font-family: 'Montserrat'; font-weight: 700; font-size: 0.6rem; color: #555; border: 1px solid #1a2a35; background: none; transition: 0.2s; }
        .cal-view-btn.active { background: #1a2a35; color: var(--brand-accent); border-color: var(--brand-accent); }

        .cal-grid-month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-day-header { text-align: center; font-size: 0.55rem; color: #555; font-weight: 800; font-family: 'Montserrat'; padding: 4px 0; text-transform: uppercase; }
        .cal-day { min-height: 52px; background: #050d12; border-radius: 4px; padding: 4px; border: 1px solid transparent; transition: 0.15s; }
        .cal-day.has-session { background: #0a1f2e; border-color: #1a3a4a; cursor: pointer; }
        .cal-day.has-session:hover { border-color: var(--brand-accent); }
        .cal-day.today { border-color: var(--brand-accent) !important; }
        .cal-day-num { font-size: 0.7rem; color: #444; margin-bottom: 2px; }
        .cal-day.today .cal-day-num { color: var(--brand-accent); font-weight: 800; }
        .cal-day.other-month .cal-day-num { color: #222; }
        .cal-session-dot { background: var(--brand-secondary); border-radius: 3px; padding: 2px 4px; font-size: 0.5rem; color: white; font-weight: 800; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .cal-grid-week { display: flex; flex-direction: column; gap: 6px; }
        .cal-week-day { background: #050d12; border-radius: 6px; padding: 10px; border: 1px solid #1a2a35; }
        .cal-week-day.today { border-color: var(--brand-accent); }
        .cal-week-day-label { font-size: 0.65rem; color: #555; font-family: 'Montserrat'; font-weight: 700; margin-bottom: 4px; }
        .cal-week-session { background: #0e2a1a; border: 1px solid #1a4a2a; border-radius: 4px; padding: 6px 8px; margin-bottom: 4px; }
        .cal-week-session-name { font-size: 0.75rem; font-weight: 700; color: #4ade80; }
        .cal-week-session-sub { font-size: 0.65rem; color: #555; margin-top: 2px; }
        .cal-empty { color: #333; font-size: 0.65rem; }

        .session-tooltip { background: var(--card-bg); border: 1px solid #1a3a4a; border-radius: 6px; padding: 8px 10px; font-size: 0.72rem; margin-top: 4px; }
        .session-tooltip-name { font-weight: 700; color: var(--brand-accent); margin-bottom: 2px; }
        .session-tooltip-sub { color: #888; }
    </style>
</head>
<body>

    <div class="nav-top">
        <div style="font-weight:800; font-size:1.2rem; font-family:'Montserrat';">REST <span style="color:var(--brand-accent)">PERIOD</span></div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">DASHBOARD</a>
            <a href="builder.html">BUILDER</a>
            <a href="library.html">LIBRARY</a>
            <a href="#" onclick="handleLogout()">LOGOUT</a>
        </div>
    </div>

    <div class="dashboard-grid">

        <!-- LEFT: Client roster -->
        <div class="col">
            <h3>👥 Clients</h3>
            <input type="text" id="search-roster" placeholder="Search..." onkeyup="filterClients()">
            <div id="roster-list"></div>
        </div>

        <!-- MIDDLE: Client profile -->
        <div class="col" id="middle-col" style="visibility:hidden;">
            <div class="card">
                <h2 id="display-name" style="margin:0; font-family:'Montserrat';">Select a Client</h2>
                <p id="display-email" style="margin:5px 0 0 0; opacity:0.5; font-size:0.8rem;"></p>
            </div>

            <div class="card medical-box">
                <h3 style="color:var(--brand-danger);"><i class="fas fa-file-medical"></i> Medical & Injury Notes</h3>
                <textarea id="medical-notes" style="height:120px;"
                    placeholder="List surgeries, contraindications, or current injuries..."
                    onchange="updateMedical()"></textarea>
            </div>

            <div class="card">
                <h3><i class="fas fa-dumbbell"></i> Active Programs</h3>
                <div id="active-progs-list"></div>
                <button class="btn btn-outline" style="margin-top:10px;" onclick="window.location.href='builder.html'">+ OPEN BUILDER</button>
            </div>
        </div>

        <!-- RIGHT: Notes + Calendar tabs -->
        <div class="col" id="right-col" style="visibility:hidden;">

            <div class="right-tabs">
                <button class="right-tab active" id="tab-notes-btn" onclick="switchRightTab('notes')">📝 Notes</button>
                <button class="right-tab" id="tab-cal-btn" onclick="switchRightTab('calendar')">📅 Calendar</button>
            </div>

            <!-- NOTES PANEL -->
            <div id="panel-notes">
                <div class="card">
                    <h3><i class="fas fa-pen"></i> New Session Note</h3>
                    <textarea id="new-note-content" style="height:80px;" placeholder="How did today's session go?"></textarea>
                    <button class="btn btn-green" onclick="saveNewNote()">Post to Timeline</button>
                </div>
                <h3><i class="fas fa-history"></i> Coach's Timeline</h3>
                <div id="notes-timeline"></div>
            </div>

            <!-- CALENDAR PANEL -->
            <div id="panel-calendar" style="display:none;">
                <div class="cal-view-toggle">
                    <button class="cal-view-btn active" id="view-month-btn" onclick="setCalView('month')">Month</button>
                    <button class="cal-view-btn" id="view-week-btn" onclick="setCalView('week')">Week</button>
                </div>
                <div class="cal-nav">
                    <button onclick="moveCal(-1)">← Prev</button>
                    <span class="cal-period" id="cal-period"></span>
                    <button onclick="moveCal(1)">Next →</button>
                </div>
                <div id="cal-content"></div>
            </div>

        </div>
    </div>

    <script>
        const pb = new PocketBase('https://restperiod.org');
        let selectedClientId = null;
        let clientPrograms = [];
        let calView = 'month';
        let calDate = new Date();

        window.onload = async () => {
            if (!pb.authStore.isValid) window.location.href = 'index.html';
            loadClients();
        };

        // ── Clients ───────────────────────────────────────
        async function loadClients() {
            try {
                const users = await pb.collection('users').getList(1, 100, { filter: 'role="client"', sort: 'name' });
                document.getElementById('roster-list').innerHTML = users.items.map(u => `
                    <div class="client-item" id="client-${u.id}" onclick="selectClient('${u.id}')">
                        ${u.name}
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        async function selectClient(id) {
            selectedClientId = id;
            document.querySelectorAll('.client-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`client-${id}`).classList.add('active');
            document.getElementById('middle-col').style.visibility = 'visible';
            document.getElementById('right-col').style.visibility = 'visible';

            try {
                const user = await pb.collection('users').getOne(id);
                document.getElementById('display-name').innerText = user.name.toUpperCase();
                document.getElementById('display-email').innerText = user.email;
                // medical notes stored in 'field' on users collection
                document.getElementById('medical-notes').value = user.field || '';

                const progs = await pb.collection('programs').getList(1, 10, {
                    filter: `client="${id}" && archived=false`, sort: '-created'
                });
                clientPrograms = progs.items;

                document.getElementById('active-progs-list').innerHTML = progs.items.map(p => `
                    <div class="prog-row">
                        <span>${p.name}</span>
                        <span style="font-size:0.7rem; opacity:0.5;">${new Date(p.created).toLocaleDateString()}</span>
                    </div>
                `).join('') || '<p style="font-size:0.8rem; opacity:0.5;">No active programs.</p>';

                loadTimeline(id);
                calDate = new Date();
                renderCalendar();

            } catch(e) { console.error(e); }
        }

        // ── Medical notes ─────────────────────────────────
        async function updateMedical() {
            if (!selectedClientId) return;
            try {
                await pb.collection('users').update(selectedClientId, {
                    field: document.getElementById('medical-notes').value
                });
            } catch(e) { alert('Save failed: ' + e.message); }
        }

        // ── Right column tabs ─────────────────────────────
        function switchRightTab(tab) {
            document.getElementById('tab-notes-btn').classList.toggle('active', tab === 'notes');
            document.getElementById('tab-cal-btn').classList.toggle('active', tab === 'calendar');
            document.getElementById('panel-notes').style.display = tab === 'notes' ? 'block' : 'none';
            document.getElementById('panel-calendar').style.display = tab === 'calendar' ? 'block' : 'none';
            if (tab === 'calendar') renderCalendar();
        }

        // ── Notes timeline ────────────────────────────────
        async function loadTimeline(id) {
            try {
                const notes = await pb.collection('Notes').getList(1, 50, {
                    filter: `client="${id}"`, sort: '-created'
                });
                document.getElementById('notes-timeline').innerHTML = notes.items.map(n => `
                    <div class="note-entry">
                        <div class="note-date">${new Date(n.created).toLocaleString()}</div>
                        <div>${n.Text || n.content || ''}</div>
                        <button class="note-delete" onclick="deleteNote('${n.id}')">✕</button>
                    </div>
                `).join('') || '<p style="font-size:0.8rem; padding:10px; opacity:0.5;">No notes yet.</p>';
            } catch(e) { console.error('Timeline error:', e); }
        }

        async function saveNewNote() {
            const content = document.getElementById('new-note-content').value.trim();
            if (!content || !selectedClientId) return;
            try {
                await pb.collection('Notes').create({
                    client: selectedClientId,
                    coach: pb.authStore.model.id,
                    Text: content,
                    Date: new Date().toISOString().split('T')[0]
                });
                document.getElementById('new-note-content').value = '';
                loadTimeline(selectedClientId);
            } catch(e) { alert('Note failed to save: ' + e.message); }
        }

        async function deleteNote(id) {
            if (!confirm('Delete this note?')) return;
            try {
                await pb.collection('Notes').delete(id);
                loadTimeline(selectedClientId);
            } catch(e) { alert('Delete failed: ' + e.message); }
        }

        // ── Completion Calendar ───────────────────────────
        function setCalView(view) {
            calView = view;
            document.getElementById('view-month-btn').classList.toggle('active', view === 'month');
            document.getElementById('view-week-btn').classList.toggle('active', view === 'week');
            renderCalendar();
        }

        function moveCal(dir) {
            if (calView === 'month') {
                calDate.setMonth(calDate.getMonth() + dir);
            } else {
                calDate.setDate(calDate.getDate() + dir * 7);
            }
            renderCalendar();
        }

        async function renderCalendar() {
            if (!selectedClientId) return;

            // Fetch all programs for this client and build session map
            const sessionMap = {}; // date string -> [{programName, weekNum, pct}]

            for (const prog of clientPrograms) {
                let data = prog.workout_data;
                if (typeof data === 'string') data = JSON.parse(data);
                const schedule = data.schedule || data;

                schedule.forEach(week => {
                    if (!week.sessionDate) return;
                    const dateStr = week.sessionDate.substring(0, 10);

                    // Calculate completion %
                    let total = 0, done = 0;
                    [...(week.warmup||[]), ...(week.exercises||[])].forEach(ex => {
                        (ex.setsData||[]).forEach(s => {
                            total++;
                            if (s.act_reps && s.act_weight) done++;
                        });
                    });
                    const pct = total > 0 ? Math.round((done/total)*100) : 0;

                    if (!sessionMap[dateStr]) sessionMap[dateStr] = [];
                    sessionMap[dateStr].push({
                        programName: prog.name,
                        weekNum: week.weekNum,
                        pct
                    });
                });
            }

            if (calView === 'month') renderMonthView(sessionMap);
            else renderWeekView(sessionMap);
        }

        function renderMonthView(sessionMap) {
            const year = calDate.getFullYear();
            const month = calDate.getMonth();
            const today = new Date().toISOString().split('T')[0];

            document.getElementById('cal-period').textContent =
                calDate.toLocaleDateString([], { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDow = (firstDay.getDay() + 6) % 7; // Mon = 0

            let html = `<div class="cal-grid-month">`;
            ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => {
                html += `<div class="cal-day-header">${d}</div>`;
            });

            // Blank cells before month starts
            for (let i = 0; i < startDow; i++) {
                html += `<div class="cal-day other-month"></div>`;
            }

            for (let d = 1; d <= lastDay.getDate(); d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const sessions = sessionMap[dateStr] || [];
                const isToday = dateStr === today;
                const hasSess = sessions.length > 0;

                html += `<div class="cal-day ${hasSess ? 'has-session' : ''} ${isToday ? 'today' : ''}"
                    ${hasSess ? `title="${sessions.map(s => `${s.programName} Wk${s.weekNum} (${s.pct}%)`).join(', ')}"` : ''}>
                    <div class="cal-day-num">${d}</div>
                    ${sessions.map(s =>
                        `<div class="cal-session-dot" title="${s.programName} Wk${s.weekNum}">Wk${s.weekNum}</div>`
                    ).join('')}
                </div>`;
            }

            html += `</div>`;
            document.getElementById('cal-content').innerHTML = html;
        }

        function renderWeekView(sessionMap) {
            const today = new Date().toISOString().split('T')[0];
            const dow = (calDate.getDay() + 6) % 7;
            const monday = new Date(calDate);
            monday.setDate(calDate.getDate() - dow);

            const days = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(monday.getDate() + i);
                days.push(d);
            }

            const startStr = days[0].toLocaleDateString([], { month: 'short', day: 'numeric' });
            const endStr = days[6].toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('cal-period').textContent = `${startStr} – ${endStr}`;

            const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

            let html = `<div class="cal-grid-week">`;
            days.forEach((day, i) => {
                const dateStr = day.toISOString().split('T')[0];
                const sessions = sessionMap[dateStr] || [];
                const isToday = dateStr === today;

                html += `<div class="cal-week-day ${isToday ? 'today' : ''}">
                    <div class="cal-week-day-label">${dayNames[i]} ${day.getDate()}</div>
                    ${sessions.length === 0
                        ? `<div class="cal-empty">—</div>`
                        : sessions.map(s => `
                            <div class="cal-week-session">
                                <div class="cal-week-session-name">${s.programName}</div>
                                <div class="cal-week-session-sub">Week ${s.weekNum} · ${s.pct}% complete</div>
                            </div>`).join('')
                    }
                </div>`;
            });
            html += `</div>`;
            document.getElementById('cal-content').innerHTML = html;
        }

        // ── Misc ──────────────────────────────────────────
        function filterClients() {
            const q = document.getElementById('search-roster').value.toLowerCase();
            document.querySelectorAll('.client-item').forEach(el => {
                el.style.display = el.innerText.toLowerCase().includes(q) ? 'block' : 'none';
            });
        }

        function handleLogout() { pb.authStore.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>

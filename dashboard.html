<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Dashboard | RestPeriod</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.3/pocketbase.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap');
        
        :root { 
            --brand-bg: #020c12; --card-bg: #0e1b24; --brand-accent: #26C6DA;
            --brand-secondary: #2E7D32; --text-main: #E0F7FA; --brand-danger: #ff5252;
        }

        body { margin: 0; font-family: 'Open Sans', sans-serif; background: var(--brand-bg); color: var(--text-main); height: 100vh; overflow: hidden; }

        .nav-top { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: #000; border-bottom: 1px solid #004d7a; }
        .nav-links a { color: #888; text-decoration: none; margin-left: 20px; font-family: 'Montserrat'; font-weight: 700; font-size: 0.8rem; }
        .nav-links a.active { color: white; border-bottom: 2px solid var(--brand-accent); }

        .dashboard-grid { display: grid; grid-template-columns: 300px 1fr 380px; gap: 0; height: calc(100vh - 65px); }
        .col { border-right: 1px solid #1a2a35; padding: 20px; overflow-y: auto; height: 100%; }
        .col:last-child { border-right: none; }

        .card { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid #1a2a35; margin-bottom: 15px; }
        h3 { font-family: 'Montserrat'; font-size: 0.75rem; color: var(--brand-accent); margin-top: 0; letter-spacing: 1px; text-transform: uppercase; }

        .client-item { padding: 12px; border-radius: 6px; cursor: pointer; border-bottom: 1px solid #1a2a35; transition: 0.2s; }
        .client-item:hover { background: #152733; }
        .client-item.active { background: var(--brand-accent); color: black; font-weight: 800; }

        input, textarea { width: 100%; background: #050d12; border: 1px solid #1a2a35; color: white; padding: 10px; border-radius: 4px; font-family: inherit; margin-bottom: 10px; }
        .medical-box { border-left: 4px solid var(--brand-danger); background: rgba(255, 82, 82, 0.05); }

        .btn { border: none; padding: 10px; border-radius: 4px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-family: 'Montserrat'; font-size: 0.7rem; width: 100%; }
        .btn-green { background: var(--brand-secondary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--brand-accent); color: var(--brand-accent); }

        .right-tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #050d12; padding: 4px; border-radius: 8px; }
        .right-tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; border-radius: 6px; font-family: 'Montserrat'; font-weight: 700; font-size: 0.7rem; color: #555; border: none; background: none; transition: 0.2s; }
        .right-tab.active { background: var(--brand-accent); color: #000; }

        .note-entry { padding: 10px; border-bottom: 1px solid #1a2a35; font-size: 0.8rem; position: relative; }
        .note-date { font-size: 0.65rem; color: var(--brand-accent); margin-bottom: 4px; }
        .note-delete { position: absolute; top: 10px; right: 0; background: none; border: none; color: #333; cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
        .note-delete:hover { color: var(--brand-danger); }

        .prog-row { display: flex; justify-content: space-between; align-items: center; background: #050d12; padding: 10px; margin-bottom: 5px; border-radius: 4px; font-size: 0.85rem; }

        /* Calendar */
        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .cal-nav button { background: #050d12; border: 1px solid #1a2a35; color: var(--brand-accent); padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: 'Montserrat'; font-weight: 700; font-size: 0.65rem; }
        .cal-nav button:hover { background: #0e1b24; }
        .cal-period { font-family: 'Montserrat'; font-weight: 700; font-size: 0.8rem; color: white; }
        .cal-view-toggle { display: flex; gap: 4px; margin-bottom: 12px; }
        .cal-view-btn { flex: 1; padding: 6px; text-align: center; cursor: pointer; border-radius: 4px; font-family: 'Montserrat'; font-weight: 700; font-size: 0.6rem; color: #555; border: 1px solid #1a2a35; background: none; transition: 0.2s; }
        .cal-view-btn.active { background: #1a2a35; color: var(--brand-accent); border-color: var(--brand-accent); }

        /* Month grid */
        .cal-grid-month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-day-header { text-align: center; font-size: 0.55rem; color: #555; font-weight: 800; font-family: 'Montserrat'; padding: 4px 0; text-transform: uppercase; }
        .cal-day { min-height: 52px; background: #050d12; border-radius: 4px; padding: 4px; border: 1px solid transparent; transition: 0.15s; position: relative; }
        .cal-day.has-session { background: #0a1f2e; border-color: #1a3a4a; }
        .cal-day.has-planned { border-color: #2a1a3a; }
        .cal-day.today { border-color: var(--brand-accent) !important; }
        .cal-day-num { font-size: 0.7rem; color: #444; margin-bottom: 2px; }
        .cal-day.today .cal-day-num { color: var(--brand-accent); font-weight: 800; }
        .cal-day.other-month .cal-day-num { color: #222; }
        .cal-session-dot { border-radius: 3px; padding: 2px 4px; font-size: 0.5rem; color: white; font-weight: 800; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--brand-secondary); }
        .cal-session-dot.planned { background: #4a1a6a; cursor: pointer; }
        .add-plan-btn { position: absolute; bottom: 3px; right: 3px; background: none; border: none; color: #333; cursor: pointer; font-size: 0.75rem; padding: 0; line-height: 1; transition: 0.2s; }
        .add-plan-btn:hover { color: var(--brand-accent); }

        /* Week grid */
        .cal-grid-week { display: flex; flex-direction: column; gap: 6px; }
        .cal-week-day { background: #050d12; border-radius: 6px; padding: 10px; border: 1px solid #1a2a35; }
        .cal-week-day.today { border-color: var(--brand-accent); }
        .cal-week-day-label { font-size: 0.65rem; color: #555; font-family: 'Montserrat'; font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .cal-week-session { background: #0e2a1a; border: 1px solid #1a4a2a; border-radius: 4px; padding: 6px 8px; margin-bottom: 4px; }
        .cal-week-session.planned { background: #1a0e2a; border-color: #3a1a4a; cursor: pointer; }
        .cal-week-session-name { font-size: 0.75rem; font-weight: 700; color: #4ade80; }
        .cal-week-session-name.planned { color: #c084fc; }
        .cal-week-session-sub { font-size: 0.65rem; color: #555; margin-top: 2px; }
        .cal-empty { color: #333; font-size: 0.65rem; }
        .week-add-btn { background: none; border: 1px solid #1a2a35; color: var(--brand-accent); border-radius: 4px; padding: 2px 6px; font-size: 0.55rem; cursor: pointer; font-family: 'Montserrat'; font-weight: 800; }

        /* Plan modal */
        .plan-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 6000; align-items: center; justify-content: center; padding: 20px; }
        .plan-modal-overlay.open { display: flex; }
        .plan-modal { background: var(--card-bg); border: 1px solid var(--brand-accent); border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .plan-modal h3 { font-family: 'Montserrat'; font-size: 0.85rem; color: var(--brand-accent); margin: 0 0 16px; }
        .plan-field { margin-bottom: 12px; }
        .plan-label { font-size: 0.6rem; font-weight: 800; color: #888; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 5px; }
        .plan-input { width: 100%; background: #050d12; border: 1px solid #1a2a35; color: white; padding: 10px; border-radius: 6px; font-family: inherit; font-size: 0.9rem; margin-bottom: 0; }
        .plan-input:focus { outline: none; border-color: var(--brand-accent); }
        .plan-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
        .plan-btn { padding: 10px; border: none; border-radius: 6px; font-family: 'Montserrat'; font-weight: 800; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }
        .plan-btn-save { background: var(--brand-secondary); color: white; }
        .plan-btn-cancel { background: #1a2a35; color: #888; }
        .plan-btn-delete { background: rgba(255,82,82,0.1); color: #ff5252; border: 1px solid #ff5252; grid-column: 1/-1; }
    </style>
</head>
<body>

    <div class="nav-top">
        <div style="font-weight:800; font-size:1.2rem; font-family:'Montserrat';">REST <span style="color:var(--brand-accent)">PERIOD</span></div>
        <div class="nav-links">
            <a href="dashboard.html" class="active">DASHBOARD</a>
            <a href="builder.html">BUILDER</a>
            <a href="library.html">LIBRARY</a>
            <a href="#" onclick="handleLogout()">LOGOUT</a>
        </div>
    </div>

    <div class="dashboard-grid">

        <div class="col">
            <h3>👥 Clients</h3>
            <input type="text" id="search-roster" placeholder="Search..." onkeyup="filterClients()">
            <div id="roster-list"></div>
        </div>

        <div class="col" id="middle-col" style="visibility:hidden;">
            <div class="card">
                <h2 id="display-name" style="margin:0; font-family:'Montserrat';">Select a Client</h2>
                <p id="display-email" style="margin:5px 0 0 0; opacity:0.5; font-size:0.8rem;"></p>
            </div>
            <div class="card medical-box">
                <h3 style="color:var(--brand-danger);"><i class="fas fa-file-medical"></i> Medical & Injury Notes</h3>
                <textarea id="medical-notes" style="height:120px;" placeholder="List surgeries, contraindications, or current injuries..." onchange="updateMedical()"></textarea>
            </div>
            <div class="card">
                <h3><i class="fas fa-dumbbell"></i> Active Programs</h3>
                <div id="active-progs-list"></div>
                <button class="btn btn-outline" style="margin-top:10px;" onclick="window.location.href='builder.html'">+ OPEN BUILDER</button>
            </div>
        </div>

        <div class="col" id="right-col" style="visibility:hidden;">
            <div class="right-tabs">
                <button class="right-tab active" id="tab-notes-btn" onclick="switchRightTab('notes')">📝 Notes</button>
                <button class="right-tab" id="tab-cal-btn" onclick="switchRightTab('calendar')">📅 Calendar</button>
            </div>

            <div id="panel-notes">
                <div class="card">
                    <h3><i class="fas fa-pen"></i> New Session Note</h3>
                    <textarea id="new-note-content" style="height:80px;" placeholder="How did today's session go?"></textarea>
                    <button class="btn btn-green" onclick="saveNewNote()">Post to Timeline</button>
                </div>
                <h3><i class="fas fa-history"></i> Coach's Timeline</h3>
                <div id="notes-timeline"></div>
            </div>

            <div id="panel-calendar" style="display:none;">
                <div class="cal-view-toggle">
                    <button class="cal-view-btn active" id="view-month-btn" onclick="setCalView('month')">Month</button>
                    <button class="cal-view-btn" id="view-week-btn" onclick="setCalView('week')">Week</button>
                </div>
                <div class="cal-nav">
                    <button onclick="moveCal(-1)">← Prev</button>
                    <span class="cal-period" id="cal-period"></span>
                    <button onclick="moveCal(1)">Next →</button>
                </div>
                <div id="cal-content"></div>
            </div>
        </div>
    </div>

    <!-- PLAN MODAL -->
    <div class="plan-modal-overlay" id="plan-modal" onclick="if(event.target===this)closePlanModal()">
        <div class="plan-modal">
            <h3 id="plan-modal-title">📅 Add Planned Workout</h3>
            <input type="hidden" id="plan-id">
            <div class="plan-field">
                <span class="plan-label">Title</span>
                <input type="text" class="plan-input" id="plan-title" placeholder="e.g. Morning Run" />
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div class="plan-field">
                    <span class="plan-label">Date</span>
                    <input type="date" class="plan-input" id="plan-date" />
                </div>
                <div class="plan-field">
                    <span class="plan-label">Time</span>
                    <input type="time" class="plan-input" id="plan-time" />
                </div>
            </div>
            <div class="plan-field">
                <span class="plan-label">Type</span>
                <select class="plan-input" id="plan-type">
                    <option value="strength">💪 Strength</option>
                    <option value="cardio">🏃 Cardio</option>
                    <option value="recovery">🧘 Recovery</option>
                    <option value="mobility">🤸 Mobility</option>
                    <option value="other">⚡ Other</option>
                </select>
            </div>
            <div class="plan-field">
                <span class="plan-label">Notes</span>
                <textarea class="plan-input" id="plan-notes" rows="3" placeholder="Any details..."></textarea>
            </div>
            <div class="plan-field">
                <span class="plan-label">Repeat</span>
                <select class="plan-input" id="plan-repeat" onchange="toggleRepeatOptions()">
                    <option value="none">One-off</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="custom">Custom days</option>
                </select>
            </div>
            <div id="repeat-days-field" class="plan-field" style="display:none;">
                <span class="plan-label">Repeat on days</span>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">
                    <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Mon" style="width:auto;margin:0;"> Mon</label>
                    <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Tue" style="width:auto;margin:0;"> Tue</label>
                    <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Wed" style="width:auto;margin:0;"> Wed</label>
                    <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Thu" style="width:auto;margin:0;"> Thu</label>
                    <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Fri" style="width:auto;margin:0;"> Fri</label>
                    <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Sat" style="width:auto;margin:0;"> Sat</label>
                    <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;cursor:pointer;"><input type="checkbox" class="repeat-day-cb" value="Sun" style="width:auto;margin:0;"> Sun</label>
                </div>
            </div>
            <div id="repeat-until-field" class="plan-field" style="display:none;">
                <span class="plan-label">Repeat until</span>
                <input type="date" class="plan-input" id="plan-repeat-until" />
            </div>
            <div class="plan-actions">
                <button class="plan-btn plan-btn-save" onclick="savePlan()">Save</button>
                <button class="plan-btn plan-btn-cancel" onclick="closePlanModal()">Cancel</button>
                <button class="plan-btn plan-btn-delete" id="plan-delete-btn" style="display:none;" onclick="deletePlan()">Delete this workout</button>
            </div>
        </div>
    </div>

    <script>
        const pb = new PocketBase('https://restperiod.org');
        let selectedClientId = null;
        let clientPrograms = [];
        let clientPlanned = [];
        let calView = 'month';
        let calDate = new Date();

        const typeColors = {
            strength: '#26C6DA', cardio: '#f87171', recovery: '#c084fc',
            mobility: '#4ade80', other: '#fb923c'
        };
        const typeEmoji = {
            strength: '💪', cardio: '🏃', recovery: '🧘', mobility: '🤸', other: '⚡'
        };

        window.onload = async () => {
            if (!pb.authStore.isValid) window.location.href = 'index.html';
            loadClients();
        };

        // ── Clients ───────────────────────────────────────
        async function loadClients() {
            try {
                const users = await pb.collection('users').getList(1, 100, { filter: 'role="client"', sort: 'name' });
                document.getElementById('roster-list').innerHTML = users.items.map(u => `
                    <div class="client-item" id="client-${u.id}" onclick="selectClient('${u.id}')">
                        ${u.name}
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        async function selectClient(id) {
            selectedClientId = id;
            document.querySelectorAll('.client-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`client-${id}`).classList.add('active');
            document.getElementById('middle-col').style.visibility = 'visible';
            document.getElementById('right-col').style.visibility = 'visible';

            try {
                const [user, progs, planned] = await Promise.all([
                    pb.collection('users').getOne(id),
                    pb.collection('programs').getList(1, 10, { filter: `client="${id}" && archived=false`, sort: '-created' }),
                    pb.collection('planned_workouts').getFullList({ filter: `user="${id}"`, sort: 'date', requestKey: null })
                ]);

                document.getElementById('display-name').innerText = user.name.toUpperCase();
                document.getElementById('display-email').innerText = user.email;
                document.getElementById('medical-notes').value = user.field || '';

                clientPrograms = progs.items;
                clientPlanned = planned;

                document.getElementById('active-progs-list').innerHTML = progs.items.map(p => `
                    <div class="prog-row">
                        <span>${p.name}</span>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <span style="font-size:0.7rem; opacity:0.5;">${new Date(p.created).toLocaleDateString()}</span>
                            <button onclick="window.location.href='program.html?id=${p.id}&clientId=${id}'"
                                style="background:var(--brand-accent);color:#000;border:none;padding:4px 10px;border-radius:4px;font-size:0.65rem;font-weight:800;cursor:pointer;font-family:'Montserrat';">
                                LOG
                            </button>
                        </div>
                    </div>
                `).join('') || '<p style="font-size:0.8rem; opacity:0.5;">No active programs.</p>';

                loadTimeline(id);
                calDate = new Date();
                renderCalendar();
            } catch(e) { console.error(e); }
        }

        // ── Medical notes ─────────────────────────────────
        async function updateMedical() {
            if (!selectedClientId) return;
            try {
                await pb.collection('users').update(selectedClientId, { field: document.getElementById('medical-notes').value });
            } catch(e) { alert('Save failed: ' + e.message); }
        }

        // ── Right column tabs ─────────────────────────────
        function switchRightTab(tab) {
            document.getElementById('tab-notes-btn').classList.toggle('active', tab === 'notes');
            document.getElementById('tab-cal-btn').classList.toggle('active', tab === 'calendar');
            document.getElementById('panel-notes').style.display = tab === 'notes' ? 'block' : 'none';
            document.getElementById('panel-calendar').style.display = tab === 'calendar' ? 'block' : 'none';
            if (tab === 'calendar') renderCalendar();
        }

        // ── Notes ─────────────────────────────────────────
        async function loadTimeline(id) {
            try {
                const notes = await pb.collection('Notes').getList(1, 50, { filter: `client="${id}"`, sort: '-created' });
                document.getElementById('notes-timeline').innerHTML = notes.items.map(n => `
                    <div class="note-entry">
                        <div class="note-date">${new Date(n.created).toLocaleString()}</div>
                        <div>${n.Text || n.content || ''}</div>
                        <button class="note-delete" onclick="deleteNote('${n.id}')">✕</button>
                    </div>
                `).join('') || '<p style="font-size:0.8rem; padding:10px; opacity:0.5;">No notes yet.</p>';
            } catch(e) { console.error('Timeline error:', e); }
        }

        async function saveNewNote() {
            const content = document.getElementById('new-note-content').value.trim();
            if (!content || !selectedClientId) return;
            try {
                await pb.collection('Notes').create({
                    client: selectedClientId,
                    coach: pb.authStore.model.id,
                    Text: content,
                    Date: new Date().toISOString().split('T')[0]
                });
                document.getElementById('new-note-content').value = '';
                loadTimeline(selectedClientId);
            } catch(e) { alert('Note failed to save: ' + e.message); }
        }

        async function deleteNote(id) {
            if (!confirm('Delete this note?')) return;
            try {
                await pb.collection('Notes').delete(id);
                loadTimeline(selectedClientId);
            } catch(e) { alert('Delete failed: ' + e.message); }
        }

        // ── Calendar ──────────────────────────────────────
        function setCalView(view) {
            calView = view;
            document.getElementById('view-month-btn').classList.toggle('active', view === 'month');
            document.getElementById('view-week-btn').classList.toggle('active', view === 'week');
            renderCalendar();
        }

        function moveCal(dir) {
            if (calView === 'month') calDate.setMonth(calDate.getMonth() + dir);
            else calDate.setDate(calDate.getDate() + dir * 7);
            renderCalendar();
        }

        function getPlannedForDate(dateStr) {
            const results = [];
            clientPlanned.forEach(pw => {
                const pwDate = pw.date?.substring(0,10);
                if (!pwDate) return;
                if (pw.repeat === 'none' && pwDate === dateStr) {
                    results.push(pw);
                } else if (pw.repeat === 'daily') {
                    const until = pw.repeat_until ? pw.repeat_until.substring(0,10) : '2099-12-31';
                    if (dateStr >= pwDate && dateStr <= until) results.push(pw);
                } else if (pw.repeat === 'weekly') {
                    const until = pw.repeat_until ? pw.repeat_until.substring(0,10) : '2099-12-31';
                    if (dateStr >= pwDate && dateStr <= until) {
                        if (new Date(pwDate).getDay() === new Date(dateStr).getDay()) results.push(pw);
                    }
                } else if (pw.repeat === 'custom') {
                    const until = pw.repeat_until ? pw.repeat_until.substring(0,10) : '2099-12-31';
                    if (dateStr >= pwDate && dateStr <= until) {
                        const days = (pw.repeat_days || '').split(',');
                        const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                        if (days.includes(dayNames[new Date(dateStr).getDay()])) results.push(pw);
                    }
                }
            });
            return results;
        }

        async function renderCalendar() {
            if (!selectedClientId) return;
            const sessionMap = {};
            for (const prog of clientPrograms) {
                let data = prog.workout_data;
                if (typeof data === 'string') data = JSON.parse(data);
                const schedule = data.schedule || data;
                schedule.forEach(week => {
                    if (!week.sessionDate) return;
                    const dateStr = week.sessionDate.substring(0, 10);
                    let total = 0, done = 0;
                    [...(week.warmup||[]), ...(week.exercises||[])].forEach(ex => {
                        (ex.setsData||[]).forEach(s => { total++; if (s.act_reps && s.act_weight) done++; });
                    });
                    const pct = total > 0 ? Math.round((done/total)*100) : 0;
                    if (!sessionMap[dateStr]) sessionMap[dateStr] = [];
                    sessionMap[dateStr].push({ programName: prog.name, weekNum: week.weekNum, pct });
                });
            }
            if (calView === 'month') renderMonthView(sessionMap);
            else renderWeekView(sessionMap);
        }

        function renderMonthView(sessionMap) {
            const year = calDate.getFullYear();
            const month = calDate.getMonth();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('cal-period').textContent = calDate.toLocaleDateString([], { month: 'long', year: 'numeric' });
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDow = (firstDay.getDay() + 6) % 7;

            let html = `<div class="cal-grid-month">`;
            ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => { html += `<div class="cal-day-header">${d}</div>`; });
            for (let i = 0; i < startDow; i++) { html += `<div class="cal-day other-month"></div>`; }

            for (let d = 1; d <= lastDay.getDate(); d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const sessions = sessionMap[dateStr] || [];
                const planned = getPlannedForDate(dateStr);
                const isToday = dateStr === today;

                html += `<div class="cal-day ${sessions.length?'has-session':''} ${planned.length?'has-planned':''} ${isToday?'today':''}">
                    <div class="cal-day-num">${d}</div>
                    ${sessions.map(s => `<div class="cal-session-dot">${s.programName} · Wk${s.weekNum}</div>`).join('')}
                    ${planned.map(pw => `<div class="cal-session-dot planned" style="background:${typeColors[pw.type]||'#888'}33;color:${typeColors[pw.type]||'#888'};" onclick="openPlanModal('${dateStr}','${pw.id}');event.stopPropagation();">${typeEmoji[pw.type]||'⚡'} ${pw.title}</div>`).join('')}
                    <button class="add-plan-btn" onclick="openPlanModal('${dateStr}')" title="Add planned workout">＋</button>
                </div>`;
            }
            html += `</div>`;
            document.getElementById('cal-content').innerHTML = html;
        }

        function renderWeekView(sessionMap) {
            const today = new Date().toISOString().split('T')[0];
            const dow = (calDate.getDay() + 6) % 7;
            const monday = new Date(calDate);
            monday.setDate(calDate.getDate() - dow);
            const days = [];
            for (let i = 0; i < 7; i++) { const d = new Date(monday); d.setDate(monday.getDate() + i); days.push(d); }
            const startStr = days[0].toLocaleDateString([], { month: 'short', day: 'numeric' });
            const endStr = days[6].toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('cal-period').textContent = `${startStr} – ${endStr}`;
            const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

            let html = `<div class="cal-grid-week">`;
            days.forEach((day, i) => {
                const dateStr = day.toISOString().split('T')[0];
                const sessions = sessionMap[dateStr] || [];
                const planned = getPlannedForDate(dateStr);
                const isToday = dateStr === today;

                html += `<div class="cal-week-day ${isToday?'today':''}">
                    <div class="cal-week-day-label">
                        <span>${dayNames[i]} ${day.getDate()}</span>
                        <button class="week-add-btn" onclick="openPlanModal('${dateStr}')">+ Plan</button>
                    </div>
                    ${sessions.length===0&&planned.length===0?`<div class="cal-empty">—</div>`:''}
                    ${sessions.map(s=>`<div class="cal-week-session"><div class="cal-week-session-name">${s.programName}</div><div class="cal-week-session-sub">Week ${s.weekNum} · ${s.pct}% complete</div></div>`).join('')}
                    ${planned.map(pw=>`<div class="cal-week-session planned" onclick="openPlanModal('${dateStr}','${pw.id}')"><div class="cal-week-session-name planned" style="color:${typeColors[pw.type]||'#888'}">${typeEmoji[pw.type]||'⚡'} ${pw.title}${pw.time?' · '+pw.time:''}</div><div class="cal-week-session-sub">${pw.type}${pw.repeat!=='none'?' · repeating':''}</div></div>`).join('')}
                </div>`;
            });
            html += `</div>`;
            document.getElementById('cal-content').innerHTML = html;
        }

        // ── Plan Modal ────────────────────────────────────
        function openPlanModal(dateStr, existingId) {
            document.getElementById('plan-id').value = existingId || '';
            document.getElementById('plan-date').value = dateStr || new Date().toISOString().split('T')[0];
            document.getElementById('plan-modal-title').textContent = existingId ? '✏️ Edit Planned Workout' : '📅 Add Planned Workout';
            document.getElementById('plan-delete-btn').style.display = existingId ? 'block' : 'none';
            if (existingId) {
                const pw = clientPlanned.find(p => p.id === existingId);
                if (pw) {
                    document.getElementById('plan-title').value = pw.title || '';
                    document.getElementById('plan-time').value = pw.time || '';
                    document.getElementById('plan-type').value = pw.type || 'other';
                    document.getElementById('plan-notes').value = pw.notes || '';
                    document.getElementById('plan-repeat').value = pw.repeat || 'none';
                    document.getElementById('plan-repeat-until').value = pw.repeat_until?.substring(0,10) || '';
                    if (pw.repeat === 'custom') {
                        const days = (pw.repeat_days || '').split(',');
                        document.querySelectorAll('.repeat-day-cb').forEach(cb => { cb.checked = days.includes(cb.value); });
                    }
                }
            } else {
                document.getElementById('plan-title').value = '';
                document.getElementById('plan-time').value = '';
                document.getElementById('plan-type').value = 'strength';
                document.getElementById('plan-notes').value = '';
                document.getElementById('plan-repeat').value = 'none';
                document.getElementById('plan-repeat-until').value = '';
                document.querySelectorAll('.repeat-day-cb').forEach(cb => cb.checked = false);
            }
            toggleRepeatOptions();
            document.getElementById('plan-modal').classList.add('open');
        }

        function closePlanModal() { document.getElementById('plan-modal').classList.remove('open'); }

        function toggleRepeatOptions() {
            const val = document.getElementById('plan-repeat').value;
            document.getElementById('repeat-days-field').style.display = val === 'custom' ? 'block' : 'none';
            document.getElementById('repeat-until-field').style.display = val !== 'none' ? 'block' : 'none';
        }

        async function savePlan() {
            const title = document.getElementById('plan-title').value.trim();
            if (!title) return alert('Please enter a title');
            const repeatVal = document.getElementById('plan-repeat').value;
            const customDays = repeatVal === 'custom'
                ? Array.from(document.querySelectorAll('.repeat-day-cb:checked')).map(cb => cb.value).join(',')
                : '';
            const payload = {
                user: selectedClientId,
                title,
                date: document.getElementById('plan-date').value,
                time: document.getElementById('plan-time').value,
                type: document.getElementById('plan-type').value,
                notes: document.getElementById('plan-notes').value,
                repeat: repeatVal,
                repeat_days: customDays,
                repeat_until: document.getElementById('plan-repeat-until').value || null
            };
            try {
                const id = document.getElementById('plan-id').value;
                if (id) await pb.collection('planned_workouts').update(id, payload);
                else await pb.collection('planned_workouts').create(payload);
                closePlanModal();
                clientPlanned = await pb.collection('planned_workouts').getFullList({ filter: `user="${selectedClientId}"`, sort: 'date', requestKey: null });
                renderCalendar();
            } catch(e) { alert('Save failed: ' + e.message); }
        }

        async function deletePlan() {
            const id = document.getElementById('plan-id').value;
            if (!id || !confirm('Delete this planned workout?')) return;
            try {
                await pb.collection('planned_workouts').delete(id);
                closePlanModal();
                clientPlanned = await pb.collection('planned_workouts').getFullList({ filter: `user="${selectedClientId}"`, sort: 'date', requestKey: null });
                renderCalendar();
            } catch(e) { alert('Delete failed: ' + e.message); }
        }

        // ── Misc ──────────────────────────────────────────
        function filterClients() {
            const q = document.getElementById('search-roster').value.toLowerCase();
            document.querySelectorAll('.client-item').forEach(el => {
                el.style.display = el.innerText.toLowerCase().includes(q) ? 'block' : 'none';
            });
        }

        function handleLogout() { pb.authStore.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
